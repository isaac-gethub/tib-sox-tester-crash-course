{id:'CD-01',title:'Mapping controls to COSO and testing their design',folder:'CD-01 COSO design',
 purpose:['Before testing whether a control <b>worked</b>, you ask whether it is <b>designed</b> well enough to work at all. A badly designed control can run perfectly and still not stop the risk.','The company keeps its controls in a risk and control matrix. Each control should be linked to a risk and to the COSO framework. This test checks the links and judges whether each control, as described, would address its risk.'],
 qs:['Is each control linked to a real risk? A control with no risk has no purpose.','Is it mapped to the right COSO component and principle? Mis-mapping leaves gaps in coverage.','Would the control, as described, prevent or detect the risk? Who does it, how often, what they look at, what they do with problems.','Is there a gap: a risk with no control? Equally important.'],
 files:[['1. Risk and control matrix extract','Each risk and control with description, owner, frequency and COSO mapping: what you assess'],['2. COSO summary','The five components and 17 principles in plain terms: the yardstick for mapping'],['3. Process narratives','How the processes work: to judge whether controls fit reality'],['4. Design criteria','The company’s own standard for a well-described control']],
 checks:[['1. Linked to a real risk?','Exception: no linked risk'],['2. Mapped to the right COSO?','Exception: wrong mapping'],['3. Clearly described?','Exception: vague description'],['4. Every risk has a control?','Exception: risk uncovered']],
 start:'Take one control from the matrix',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Read the process narratives first so you understand the process before judging the controls.','Write down, in a sentence, what could go wrong at each step. These are your own view of the risks, to compare with the company’s list.','Keep the COSO summary beside you.'],q:'Why write your own list of risks before reading the matrix?',o:['To make the file longer','So you can compare it with the company’s list and spot any risk with no control','To copy into the matrix'],a:1,e:'Any risk you wrote down that has no control in the matrix is a possible gap.'},
 {t:'Stage 2: Analysing the data',pts:['For each control, note its risk, COSO mapping and the six design elements: who, what, when, how often, what evidence, what happens to exceptions.','Leave a blank where the description does not say. Blanks are a strong sign of weak design.'],q:'A control description says “Management reviews results regularly.” What do you note?',o:['Nothing; it sounds fine','Blanks: who exactly, how often exactly, what evidence, what happens to problems','It passes'],a:1,e:'“Regularly” and “management” are not testable. Vague frequency and no action for exceptions are the most common design gaps.'},
 {t:'Stage 3: Testing',pts:['Ask one question of each control: if this were done exactly as written, would it stop or catch the risk in time?','A control done too rarely, looking at the wrong thing, or with no action for problems fails the test of design, even if carried out perfectly.','Discuss borderline cases with your senior before concluding.'],q:'A control is done perfectly every year, but the risk could occur daily. Result?',o:['Pass, as it is performed well','Exception: design gap, because it is done too rarely to catch the risk in time','Not applicable'],a:1,e:'Good performance does not fix a weak design.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“CD-01 COSO design”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts controls assessed, well designed, mapping errors and design gaps, and lists uncovered risks.'],q:'Which is more serious?',o:['A control with a wrong COSO mapping','A significant risk with no control at all','They are equal'],a:1,e:'An uncovered risk means nothing is watching it.'}],
 intro:'Ten items from a risk and control matrix extract: nine controls and one risk. Judge each one’s design. Mark Pass or Exception and choose the type.',
 cols:[['Risk','rk'],['COSO mapping','co'],['Described as','ds']],
 types:{vague:'Vague description (design element missing)',mapping:'Wrong COSO mapping',uncovered:'Risk with no control'},
 rows:[
 {n:'FIN-07 Journal approval',rk:'Unauthorised journals',co:'Control activities, P10',ds:'Controller approves each journal over 50k by signing it with supporting documents; rejected journals returned',res:'Pass',why:'Linked, correctly mapped, and all six elements are present.'},
 {n:'FIN-12 Bank reconciliation',rk:'Unrecorded cash',co:'Monitoring, P16 (should be Control activities)',ds:'Accountant, monthly. What is checked, evidence and handling of exceptions are not stated',res:'Exception',type:'vague',why:'The description leaves out what is checked, the evidence and what happens to differences. It is also mapped to the wrong component, but the vague description is the larger gap.'},
 {n:'FIN-03 Vendor approval',rk:'Fictitious suppliers',co:'Control activities, P10',ds:'Procurement lead approves each new vendor by signing the request form; rejected forms returned',res:'Pass',why:'Clear who, when, evidence and action.'},
 {n:'FIN-15 Payment release',rk:'Unauthorised payments',co:'Control environment, P1',ds:'Treasury Manager releases each payment run after checking the list, signed',res:'Exception',type:'mapping',why:'Well described, but a payment release is a control activity, not part of the control environment. Wrong mapping leaves gaps in coverage.'},
 {n:'FIN-20 Access review',rk:'Inappropriate access',co:'Control activities, P11',ds:'IT Security Manager reviews finance users each quarter, removes access not needed, signed with removal tickets',res:'Pass',why:'Clear and complete.'},
 {n:'FIN-22 Period-end checks',rk:'Misstated results',co:'Monitoring, P16',ds:'Management reviews results regularly',res:'Exception',type:'vague',why:'Who exactly, how often exactly, what evidence and what happens to problems are all missing.'},
 {n:'FIN-25 Credit note check',rk:'Unauthorised credits',co:'Control activities, P10',ds:'Credit notes are checked',res:'Exception',type:'vague',why:'Nobody is named, there is no frequency and no evidence.'},
 {n:'FIN-30 Conflict review',rk:'Conflicting access',co:'Monitoring, P16',ds:'Controller reviews the conflict report monthly, queries sent to IT, signed',res:'Pass',why:'All six elements are present.'},
 {n:'R-14 Unauthorised supplier bank changes',rk:'(a risk with no control)',co:'-',ds:'No control in the matrix addresses this risk',res:'Exception',type:'uncovered',why:'A significant fraud risk has no control. Nothing is watching it.'},
 {n:'FIN-31 Three-way match',rk:'Paying for goods not received',co:'Control activities, P10',ds:'Accountant reviews each week the invoices that fail the system match, resolves them and records the ticket number',res:'Pass',why:'Clear who, how often, what and what happens to exceptions.'}],
 outPrompt:'Five pass. Three controls are too vaguely described, one is mapped to the wrong COSO component, and the supplier bank change risk has no control. Choose the outcome.',
 outs:[['Design adequate','All controls well described, mapped and linked; no gaps. Ready for testing of operation.'],['Adequate with improvements','Minor wording or mapping corrections. Reported, low risk.'],['Design gaps','Vague controls or wrong mappings. A design deficiency is raised.'],['Uncovered risk','A significant risk with no control. A serious design deficiency.']],outA:3,
 outWhy:'A significant fraud risk has no control at all, so this is the serious case. The manual’s own working paper concludes only “Design not adequate for 4 controls”, but the outcomes table rates an uncovered significant risk as serious.',
 fnd:[
 {k:'Condition (what you found)',o:['The matrix needs work.','Four controls are too vaguely described to work, and the risk of unauthorised supplier bank changes has no control.','Some controls are poor.'],a:1,e:'Count the weak controls and name the uncovered risk.'},
 {k:'Criteria (the rule it breaks)',o:['Controls must clearly address their risks.','Controls must be monthly.','The matrix must be neat.'],a:0,e:'The standard for design.'},
 {k:'Cause (why it happened)',o:['The matrix was copied from another business unit.','Staff are careless.','The framework is hard.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['Risks may not be prevented or detected.','The matrix is long.','Testing takes longer.'],a:0,e:'The effect on the risk.'},
 {k:'Recommendation (what to do)',o:['Rewrite the four descriptions and add a supplier bank change control.','Add more controls.','Remove the framework.'],a:0,e:'Fix the weak ones and cover the gap.'}],
 model:'Before testing whether a control worked, I check it is designed to work. I read each control, check it is linked to a risk and to the COSO model, and judge whether its description would actually stop the risk. Clear, linked controls pass; vague controls or risks with no control are design findings.',
 points:['Check design before checking operation','Each control links to a risk and the right COSO component','Check the six elements: who, what, when, how often, evidence, exceptions','A risk with no control is the most serious gap'],
 quiz:[
 {q:'What does a test of design ask?',o:['Did the control run?','Would the control, done exactly as written, stop or catch the risk in time?','Who wrote it?'],a:1,e:'A badly designed control can run perfectly and still fail.'},
 {q:'Which are the six design elements?',o:['Who, what, when, how often, evidence, what happens to exceptions','Cost, owner, tool, age, audience, size','Risk, COSO, owner, date, tool, cost'],a:0,e:'Leave a blank where the description does not say.'},
 {q:'A blank in a design element suggests?',o:['Nothing','Weak design','A pass'],a:1,e:'Blanks are a strong sign of weak design.'},
 {q:'“Credit notes are checked.” Result?',o:['Pass','Exception: vague description','Not applicable'],a:1,e:'No who, no frequency, no evidence.'},
 {q:'A well-described payment control is mapped to “Control environment”. Result?',o:['Pass','Exception: wrong mapping','Exception: vague'],a:1,e:'It is a control activity.'},
 {q:'A risk you identified has no matching control. What is it?',o:['A possible gap','A pass','A mapping error'],a:0,e:'Uncovered risks are equally important.'},
 {q:'Which is most common?',o:['Vague frequency and no description of what happens to exceptions','A missing COSO summary','Too many controls'],a:0,e:'These are the most common design gaps.'},
 {q:'A borderline case. What do you do?',o:['Decide alone','Discuss it with your senior before concluding','Pass it'],a:1,e:'Borderline cases are judgement calls.'}]
},

{id:'CD-02',title:'Turning requirements into controls you can test',folder:'CD-02 Control statements',
 purpose:['Requirements often arrive as general statements, like “access must be appropriate”. A tester cannot test that.','This procedure <b>produces</b> something: it turns each requirement into a precise control statement that says who does what, when, how, and with what evidence, so it can be tested. In this lesson you judge draft statements as a reviewer would.'],
 qs:['What exactly must happen to meet the requirement? Translate words into actions.','Who does it, how often, using what? The essential parts of a control.','What evidence will it leave? If it leaves no evidence, it cannot be tested.','How would a tester test it? Write the test alongside the control.'],
 files:[['1. Requirements memo','The requirements, often from policy or regulators: the starting point'],['2. Process narratives','How the work is done today: to fit controls to reality'],['3. Control statement template','The format each statement must follow: the standard'],['4. Examples of good statements','Model answers: guidance']],
 checks:[['1. Who does it named?','Exception: no owner'],['2. How often stated?','Exception: no frequency'],['3. Evidence left?','Exception: no evidence'],['4. Can it be done today?','Exception: needs process change']],
 start:'Take one requirement and its draft statement',
 walk:[
 {t:'Stage 1: Getting ready',pts:['List the requirements one by one and read the narratives for each.','Read the template and the examples of good statements first, so you know what you are aiming for.','Find the place in the process narratives where each requirement applies.'],q:'Why read the examples of good statements first?',o:['To copy them','So you know what you are aiming for','They are shorter'],a:1,e:'The standard comes before the draft.'},
 {t:'Stage 2: Analysing the data',pts:['For each requirement, ask what could go wrong if it were not met. That risk tells you what the control must do.','Find a person in a position to do it, at a point where it can still make a difference.','Think about evidence before you write. If the step leaves no record, add a simple one, such as a signature or a ticket.'],q:'The step you have in mind leaves no record. What do you do?',o:['Write the control anyway','Add a simple record, such as a signature or ticket, to the statement','Drop the requirement'],a:1,e:'A control that leaves no evidence cannot be tested.'},
 {t:'Stage 3: Testing',pts:['Write each statement using the template and check it against the six elements.','Ask a colleague to read it: could they test it without asking you anything?','Write one line saying how a tester would test it. If you cannot, the statement is not yet testable.'],q:'A colleague asks “who does this?” after reading your statement. What does it mean?',o:['Nothing','The statement is missing an owner and must be fixed','Your colleague is slow'],a:1,e:'A good statement can be tested without asking the author anything.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“CD-02 Control statements”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The working table is your deliverable: one row per requirement, ready to go into the risk and control matrix.'],q:'What is the difficult kind of requirement?',o:['One with a long title','One where the business does not yet do anything that leaves evidence: it needs a new process step first','One from a regulator'],a:1,e:'Most requirements translate easily.'}],
 intro:'Ten requirements, each with a draft control statement. Decide whether the draft is testable. Mark Pass if it is, or Exception and choose what is missing.',
 cols:[['Draft control statement','ds']],
 types:{who:'No owner named',freq:'No frequency or trigger',evid:'Leaves no evidence',process:'Needs a process change first'},
 rows:[
 {n:'Access must be appropriate',ds:'The IT Security Manager reviews all users with finance roles each quarter, removes access not needed, and signs the review.',res:'Pass',why:'Who, how often, what, action and evidence (the signed review) are all there.'},
 {n:'Journals must be authorised',ds:'The Financial Controller approves every manual journal over 50,000 before posting, by signing the journal and support.',res:'Pass',why:'Clear owner, trigger, action and evidence.'},
 {n:'Vendor changes must be controlled',ds:'Vendor changes are reviewed regularly by management.',res:'Exception',type:'who',why:'“Management” is not a person, and “regularly” is not a frequency. The missing owner is the first gap to fix.'},
 {n:'Payments must be authorised',ds:'The Treasury Manager checks the payment list before each payment run is released.',res:'Exception',type:'evid',why:'Owner and frequency are clear, but the check leaves no record. Add a signature on the list.'},
 {n:'Leavers must be removed promptly',ds:'The HR Systems Lead raises a ticket for every leaver within one business day; IT locks the account and closes the ticket after confirming the lock.',res:'Pass',why:'Owner, timing, action and evidence (the ticket).'},
 {n:'Backups must work',ds:'The IT Operations Manager reviews failed backups and reruns them.',res:'Exception',type:'freq',why:'No frequency or trigger is stated. Daily? After each failure? A tester cannot tell what to look for.'},
 {n:'Logs must be kept for 12 months',ds:'(No statement possible: the system keeps logs for 30 days only.)',res:'Exception',type:'process',why:'No control can meet the requirement until the system setting is changed. Report it for action.'},
 {n:'Interfaces must be monitored',ds:'The Finance Systems Analyst checks the interface error list each working day, reprocesses failed records and records the ticket number.',res:'Pass',why:'Complete: who, how often, what, action and evidence.'},
 {n:'Passwords must be strong',ds:'The Basis lead checks the password settings against policy each quarter and keeps a screenshot of the settings.',res:'Pass',why:'Owner, frequency, check and evidence.'},
 {n:'Changes must be approved',ds:'All changes are approved by the change board before go-live.',res:'Exception',type:'evid',why:'The owner and trigger are clear, but how the approval is recorded is not stated.'}],
 outPrompt:'Five drafts are testable, four need rewriting, and one requirement cannot be controlled until the system setting is changed. Choose the outcome for the set.',
 outs:[['All requirements covered','Every requirement has a clear, testable statement. Ready for the matrix.'],['Covered with owner changes','Owners adjust wording. Final after sign-off.'],['Not yet testable','A requirement needs a process change first. Reported for action.'],['Requirement unclear','The requirement itself is ambiguous. Ask the requirement owner.']],outA:2,
 outWhy:'The log-retention requirement cannot be met by a control until the setting is changed, so it is reported for action. The four weak drafts are fixed by rewriting; only the retention requirement blocks the set.',
 fnd:[
 {k:'Condition (what you found)',o:['Some requirements are hard.','One requirement (log retention) cannot be met by a control until the system setting is changed.','The memo is unclear.'],a:1,e:'Name the requirement and the blocker.'},
 {k:'Criteria (the rule it breaks)',o:['Every requirement must be supported by a testable control.','Requirements must be short.','Policies must be signed.'],a:0,e:'The standard for requirements.'},
 {k:'Cause (why it happened)',o:['The current setting keeps logs for 30 days only.','Nobody read the memo.','The requirement is new.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['The requirement cannot be evidenced.','The memo is out of date.','The matrix is longer.'],a:0,e:'There is nothing to show the requirement is met.'},
 {k:'Recommendation (what to do)',o:['Change the setting, then add the control statement.','Drop the requirement.','Write the control anyway.'],a:0,e:'Change the process first, then write the control.'}],
 model:'General requirements cannot be tested. I turn each one into a precise control statement: who does what, how often, and what evidence it leaves, plus how a tester would test it. If a colleague could test it without asking me anything, the statement is good.',
 points:['General requirements cannot be tested','Each statement names who, what, how often and the evidence','Add a simple record if the step leaves none','If a colleague could test it without asking you, it is good'],
 quiz:[
 {q:'Why can “access must be appropriate” not be tested?',o:['It is too short','It does not say who does what, how often, or what evidence it leaves','It is too long'],a:1,e:'A tester needs specifics.'},
 {q:'“Management reviews regularly.” What is missing?',o:['Nothing','A named owner and a real frequency','A signature only'],a:1,e:'“Management” and “regularly” are not testable.'},
 {q:'A statement has an owner and frequency but leaves no record. Result?',o:['Pass','Exception: leaves no evidence','Not applicable'],a:1,e:'If it leaves no evidence it cannot be tested.'},
 {q:'How do you add evidence to a step that leaves none?',o:['You cannot','Add a simple record such as a signature or a ticket','Drop the step'],a:1,e:'A simple record is enough.'},
 {q:'The business does not yet do anything that leaves evidence. What is needed?',o:['A longer statement','A new step in the process before a control can exist','Nothing'],a:1,e:'These are the difficult requirements.'},
 {q:'What final line do you write with each statement?',o:['A deadline','How a tester would test it','The author’s name'],a:1,e:'If you cannot write that line, it is not yet testable.'},
 {q:'A requirement needs a process change before a control is possible. Outcome for that item?',o:['All requirements covered','Not yet testable','Requirement unclear'],a:1,e:'Reported for action.'},
 {q:'The requirement itself is ambiguous. What do you do?',o:['Guess','Ask the requirement owner','Drop it'],a:1,e:'Outcome: requirement unclear.'}]
},

{id:'RV-01',title:'Reviewing a colleague’s working paper',folder:'RV-01 Workpaper review',
 purpose:['Every working paper is reviewed by a second person before it is final. The reviewer checks the work is complete, correct and supports the conclusion.','In this lesson you are the reviewer of a colleague’s working paper on a user access test. You judge each review point and decide what notes to write.'],
 qs:['Was the population proven complete? Was the list tested for completeness first?','Do the numbers agree? Counts in the paper agree to the working table and the evidence.','Were exceptions handled properly? Each explained, and the explanation evidenced.','Does the conclusion follow from the results? A paper with unresolved exceptions cannot conclude “effective”.'],
 files:[['1. The working paper','Your colleague’s Word document: what you review'],['2. Their working table','The Excel workbook: to re-check figures'],['3. The evidence folder','The original files: to trace back'],['4. Review checklist','The firm’s review points: your structure']],
 checks:[['1. Population proven complete?','Exception: not proven'],['2. Numbers agree?','Exception: figures differ'],['3. Exceptions evidenced?','Exception: unevidenced'],['4. Conclusion supported?','Exception: unsupported']],
 start:'Read the working paper end to end',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Read the paper end to end once without making notes, to understand the story.','Have the review checklist open beside the paper.','Set aside enough time to do it in one go; reviews done in fragments miss things.'],q:'Why read the whole paper before making notes?',o:['To save paper','To understand the story first, so you spot what does not fit','It is the firm’s rule only'],a:1,e:'Notes made too early are often answered later in the paper.'},
 {t:'Stage 2: Analysing the data',pts:['Trace every number in the paper back to the working table, and from the table back to the evidence files. Numbers that do not agree are the most common review note.','Re-perform a few rows yourself from the original evidence, choosing at least one passed item and one exception. A different result is a serious review note.','Read each exception and the company’s explanation. Ask whether it is backed by evidence, not just someone’s word.'],q:'You re-perform a row marked Pass and get a different result. How serious is it?',o:['Minor','Serious: the preparer’s result may be wrong','Not a note'],a:1,e:'A different result when you re-perform is a serious review note.'},
 {t:'Stage 3: Testing',pts:['For each problem, write a note a colleague can act on without asking you: what is wrong, where it is, and what is needed.','Mark each as must-fix or suggestion.','When the preparer replies, check each fix yourself before clearing the note.'],q:'Wording in the approach paragraph is unclear, but the facts are right. Note type?',o:['Must-fix','Suggestion','No note'],a:1,e:'Must-fix is for errors and gaps; wording is a suggestion.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“RV-01 Workpaper review”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The review notes sheet is your deliverable. The preparer answers each note, and you clear it when satisfied.'],q:'What are the most common must-fix notes?',o:['Spelling','Figures that do not agree between paper and table, and populations not proven complete','Fonts'],a:1,e:'Most papers need a few must-fix notes.'}],
 intro:'Ten review points on a colleague’s working paper for a user access test. Mark Pass if the paper is fine on that point, or Exception and choose the type of review note.',
 cols:[['Paper says','pp'],['Evidence or table shows','ev']],
 types:{pop:'Population not proven complete',numbers:'Numbers do not agree',exc:'Exception explanation not evidenced',concl:'Conclusion not supported',wording:'Wording only (suggestion)'},
 rows:[
 {n:'Population',pp:'User list used as the population',ev:'No count comparison with an independent total',res:'Exception',type:'pop',why:'The list was never proved complete. Must fix: perform the completeness check.'},
 {n:'Dates and scope',pp:'Test covers 1 Jan to 31 Dec',ev:'Evidence dated 1 Jan to 31 Dec',res:'Pass',why:'Agrees.'},
 {n:'Count of exceptions',pp:'3 exceptions',ev:'Working table shows 4',res:'Exception',type:'numbers',why:'The paper and table disagree. Must fix: reconcile and correct.'},
 {n:'Table traced to evidence',pp:'5 rows traced',ev:'All 5 agree to the evidence files',res:'Pass',why:'The reviewer traced them and they agree.'},
 {n:'Re-performed a passed row',pp:'Row 12: Pass',ev:'Re-performed: Pass',res:'Pass',why:'Same result as the preparer.'},
 {n:'Re-performed an exception',pp:'Row 31: Exception',ev:'Re-performed: Exception',res:'Pass',why:'Same result as the preparer.'},
 {n:'Exception 1 explanation',pp:'“Approved verbally by the manager”',ev:'No email, ticket or note on file',res:'Exception',type:'exc',why:'Backed by someone’s word, not evidence. Must fix: obtain written support or treat as unresolved.'},
 {n:'Exception 2 explanation',pp:'“Leaver on authorised leave”',ev:'HR email saved as PDF',res:'Pass',why:'The explanation is evidenced.'},
 {n:'Conclusion',pp:'“Effective”',ev:'One exception unresolved',res:'Exception',type:'concl',why:'A paper with an unresolved exception cannot conclude “effective”. Must fix: resolve or change the conclusion.'},
 {n:'Approach paragraph',pp:'Paragraph reads unclearly',ev:'Facts are correct',res:'Exception',type:'wording',why:'A suggestion, not a must-fix: reword for clarity.'}],
 outPrompt:'The paper has four must-fix problems and one suggestion. The conclusion is not supported by the evidence. Choose the review outcome.',
 outs:[['Ready to sign','No must-fix notes. Reviewer signs.'],['Minor notes','Suggestions only. Sign after small edits.'],['Must-fix notes','Errors or gaps. Returned to the preparer.'],['Conclusion wrong','Evidence contradicts the conclusion. The conclusion must change.']],outA:2,
 outWhy:'There are must-fix notes, so the paper goes back to the preparer. “Conclusion wrong” would mean the evidence actually contradicts the conclusion; here the conclusion is unsupported and the unresolved exception must be dealt with.',
 fnd:[
 {k:'Condition (what you found)',o:['The paper is poor.','The working paper concludes “effective” although one exception is unresolved and the population was not proven complete.','The preparer was careless.'],a:1,e:'State both problems precisely.'},
 {k:'Criteria (the rule it breaks)',o:['Conclusions must be supported by complete, reconciled work.','Papers must be short.','All papers must be reviewed twice.'],a:0,e:'The review standard.'},
 {k:'Cause (why it happened)',o:['The preparer worked under time pressure.','The reviewer was slow.','The template is bad.'],a:0,e:'A plausible, fixable cause, as stated by the preparer.'},
 {k:'Effect (why it matters)',o:['An unsupported conclusion could go to the auditor.','The paper is longer.','The review took time.'],a:0,e:'The risk if it were not caught.'},
 {k:'Recommendation (what to do)',o:['Address the review notes before sign-off.','Sign it anyway.','Rewrite the template.'],a:0,e:'Return it to the preparer.'}],
 model:'Every paper is checked by a second person. I trace the figures back to the evidence, re-perform a few rows, and check every exception is explained and the conclusion follows. I write a note for each problem; the paper is signed only when all must-fix notes are cleared.',
 points:['Read it once end to end first','Trace numbers back to the table and evidence','Re-perform a passed row and an exception','Write a note per problem; sign only when must-fix notes are cleared'],
 quiz:[
 {q:'What do you do first?',o:['Write notes','Read the whole paper once without notes','Check spelling'],a:1,e:'Understand the story first.'},
 {q:'The paper says 3 exceptions and the table shows 4. Note type?',o:['Suggestion','Must-fix: numbers do not agree','No note'],a:1,e:'This is the most common review note.'},
 {q:'Which rows do you re-perform?',o:['Any one','At least one passed item and one exception','Only exceptions'],a:1,e:'Both kinds can hide errors.'},
 {q:'An exception is explained by “the manager said so”. What do you do?',o:['Accept it','Ask whether it is backed by evidence','Delete the exception'],a:1,e:'The explanation must be evidenced, not just stated.'},
 {q:'The conclusion says “effective” with an unresolved exception. Result?',o:['Pass','Exception: conclusion not supported','Suggestion'],a:1,e:'It cannot conclude “effective”.'},
 {q:'A note must tell the preparer what?',o:['Who to blame','What is wrong, where it is, and what is needed','Nothing'],a:1,e:'A colleague should be able to act without asking you.'},
 {q:'When can you clear a note?',o:['When the preparer replies','When you have checked the fix yourself','At once'],a:1,e:'Check each fix yourself.'},
 {q:'The evidence contradicts the conclusion. Outcome?',o:['Ready to sign','Minor notes','Must-fix notes','Conclusion wrong'],a:3,e:'The conclusion must change.'}]
},

{id:'RC-01',title:'Finding the root cause and planning the fix',folder:'RC-01 Root cause',
 purpose:['When a test finds exceptions, writing them down is not enough. The company needs to know <b>why</b> they happened so the fix stops them recurring.','This procedure takes the findings from a test and works out the root cause and a practical remediation plan. In this lesson you judge draft root causes and plan lines, using the AR-01 findings as the case.'],
 qs:['What exactly went wrong, each time? The facts of each exception.','Is there a common cause? Several exceptions often share one cause.','Why did that cause exist? Keep asking why until you reach something the company can change.','What fix, by whom, by when, and how will we know it worked? A plan, not a wish.'],
 files:[['1. Findings and exceptions','From the test: the starting facts'],['2. Timelines','Dates and events for each exception: to see what happened when'],['3. Interview notes','Explanations from the people involved: to understand why'],['4. Remediation plan template','The required format: your deliverable layout']],
 checks:[['1. Cause beyond a person?','Exception: stops at a person'],['2. Cause beyond the symptom?','Exception: only a symptom'],['3. Explains every exception?','Exception: does not fit all'],['4. Plan has owner and retest?','Exception: plan incomplete']],
 start:'Take the exceptions from one test',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Collect all the exceptions from the test and, for each, build a short timeline of what happened and when.','Arrange to talk to the people involved. Root causes are rarely visible in the documents alone.'],q:'Why interview the people involved?',o:['It is polite','Root causes are rarely visible in the documents alone','To assign blame'],a:1,e:'The documents show what happened; people explain why.'},
 {t:'Stage 2: Analysing the data',pts:['Group the exceptions by what went wrong, for example all the late removals together.','For each group ask “why did this happen?”, write the answer, then ask why again. After three to five rounds you reach something the company can change, such as a manual step or a missing owner.','Do not stop at a person (“the clerk forgot”). People forget; a good root cause explains why the process let the forgetting matter.'],q:'“The clerk forgot.” Is this a root cause?',o:['Yes','No: keep asking why the process let the forgetting matter','Yes, if repeated'],a:1,e:'A root cause is something the company can change, usually a process gap.'},
 {t:'Stage 3: Testing',pts:['Check your root cause explains every exception in the group. If one does not fit, it has a different cause.','Write the plan: one action per root cause, a named owner, a due date, and how the fix will be tested.','Agree the plan with the owners before finalising it.'],q:'A plan says “remind staff to act faster”, with no owner or date. What is wrong?',o:['Nothing','No owner, no date and no way to test it worked','The tone'],a:1,e:'Plans fail most often because the action has no owner or no way to check it worked.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“RC-01 Root cause”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The remediation plan sheet is the deliverable, one row per root cause.'],q:'What are root causes usually?',o:['Individual carelessness','Process gaps, such as manual hand-offs or missing ownership','Bad luck'],a:1,e:'Process gaps, not people.'}],
 intro:'Ten items from a root cause analysis of the AR-01 findings (six late removals and two leavers who kept second accounts). Judge each draft cause, why-chain and plan line. Mark Pass or Exception and choose the type.',
 cols:[['Draft','dr']],
 types:{person:'Stops at a person',symptom:'Restates the symptom',partial:'Does not explain every exception',plan:'Plan has no owner, date or retest'},
 rows:[
 {n:'Cause for late removals (draft 1)',dr:'“IT forgot to lock the accounts.”',res:'Exception',type:'person',why:'It stops at a person. Why did the process let forgetting matter?'},
 {n:'Cause for late removals (draft 2)',dr:'“HR emailed a shared mailbox, so IT was notified late. There is no automatic HR-to-IT trigger.”',res:'Pass',why:'A process gap the company can fix, reached by asking why.'},
 {n:'Cause for second accounts (draft 1)',dr:'“Second accounts were left active.”',res:'Exception',type:'symptom',why:'It restates what was found. Keep asking why.'},
 {n:'Cause for second accounts (draft 2)',dr:'“Second accounts are not on the removal checklist and are not tracked against the person.”',res:'Pass',why:'A process gap with a clear fix.'},
 {n:'One cause for all eight exceptions',dr:'“The HR mailbox is the cause of all eight exceptions.”',res:'Exception',type:'partial',why:'It explains the late locks but not the second accounts. Those have a different cause.'},
 {n:'Plan: late removals',dr:'Automate leaver tickets from HR. Owner: HR Systems Lead. Due 31 Mar. Retest: re-run AR-01 for Q2.',res:'Pass',why:'Action, owner, date and retest.'},
 {n:'Plan: staff behaviour',dr:'“Remind staff to act faster.”',res:'Exception',type:'plan',why:'No owner, no date, no way to test it worked.'},
 {n:'Plan: second accounts',dr:'Add second accounts to the checklist. Owner: IT Service Manager. Due 30 Apr. Retest: re-run AR-02 for Q2.',res:'Pass',why:'Action, owner, date and retest.'},
 {n:'Agreement with owners',dr:'Both plan rows were agreed with the owners before being finalised.',res:'Pass',why:'Owners have committed.'},
 {n:'Why-chain for late removals',dr:'Why 1: IT was notified late. (Chain stops.)',res:'Exception',type:'symptom',why:'Stopping at the first why leaves a symptom. Keep asking.'}],
 outPrompt:'The late removals and the second accounts have different causes, each with its own fix and owner. Choose the outcome.',
 outs:[['Clear root cause, agreed plan','Cause explains all exceptions; owners commit. Ready for tracking.'],['Several causes','Different groups need different fixes. Multiple plan rows.'],['Symptom, not cause','The “cause” is just a restatement. Keep asking why.'],['No owner','Nobody accepts the action. Escalate.']],outA:1,
 outWhy:'The exceptions fall into two groups with different causes, so there are two plan rows. It would be a single clear cause only if one root cause explained all eight.',
 fnd:[
 {k:'Condition (what you found)',o:['Removals are late.','Six late removals all trace back to a manual email from HR to IT.','HR is slow.'],a:1,e:'The pattern, and where it comes from.'},
 {k:'Criteria (the rule it breaks)',o:['Removals must happen within one business day.','HR must email promptly.','IT must be fast.'],a:0,e:'The company’s own rule.'},
 {k:'Cause (why it happened)',o:['No automatic link between HR and the ticket tool.','The clerk was careless.','The mailbox was full.'],a:0,e:'A process gap that can be fixed.'},
 {k:'Effect (why it matters)',o:['Late removals will keep recurring.','HR is busy.','There are more tickets.'],a:0,e:'Without a fix, the failure repeats.'},
 {k:'Recommendation (what to do)',o:['Automate the trigger and retest next quarter.','Ask HR to be faster.','Do nothing.'],a:0,e:'Fix the cause and prove it worked.'}],
 model:'When I find exceptions, I work out why they really happened by asking why until I reach something the company can change. Then I write a plan with an action, owner, date and how we will retest it. A good root cause explains every exception and leads to a fix that stops them recurring.',
 points:['Writing exceptions down is not enough','Group exceptions, then ask why until you reach something fixable','Do not stop at a person or a symptom','Plan: action, owner, date, retest'],
 quiz:[
 {q:'How many rounds of “why” usually reach a fixable cause?',o:['One','Three to five','Ten'],a:1,e:'Until you reach something the company can change.'},
 {q:'“The accountant made a mistake.” What is wrong with this as a root cause?',o:['Nothing','It stops at a person','It is too long'],a:1,e:'Ask why the process let the mistake matter.'},
 {q:'A cause explains most exceptions in a group but not one. What do you conclude?',o:['Ignore the one','That one has a different cause','The cause is wrong'],a:1,e:'The cause must explain every exception in its group.'},
 {q:'What are root causes usually?',o:['Process gaps such as manual hand-offs or missing ownership','Individual carelessness','Weather'],a:0,e:'Not individual carelessness.'},
 {q:'What does a good plan line contain?',o:['An action, owner, due date and how the fix will be tested','A deadline only','A blame list'],a:0,e:'Four elements.'},
 {q:'Why agree the plan with owners before finalising?',o:['Politeness','Otherwise nobody may accept the action','It is the rule'],a:1,e:'Plans fail most often because the action has no owner.'},
 {q:'Nobody accepts the action. Outcome?',o:['Clear root cause, agreed plan','Several causes','Symptom, not cause','No owner'],a:3,e:'Escalate.'},
 {q:'The “cause” is just a restatement. Outcome?',o:['Clear root cause, agreed plan','Symptom, not cause','No owner'],a:1,e:'Keep asking why.'}]
},

{id:'PR-01',title:'Walking through purchase-to-pay and order-to-cash',folder:'PR-01 P2P and O2C',
 purpose:['A <b>walkthrough</b> follows one real transaction from start to finish to understand how a process works and where the controls are. Purchase-to-pay runs from ordering goods to paying the supplier; order-to-cash runs from a customer order to receiving the money.','This procedure follows one purchase and one sale through their documents, checking each step happened in the right order, and confirms the controls along the way.'],
 qs:['Do the documents link together? Each step refers to the one before.','Do the amounts and quantities agree across steps? For example the three-way match: order, goods received, invoice.','Did the controls happen? Approvals, matches and checks at each step.','Did it end up correctly in the accounts? The final accounting entry.'],
 files:[['1. Purchase documents','Order, goods receipt, invoice, payment, accounting entries for one purchase'],['2. Sales documents','Order, delivery, invoice, payment, accounting entries for one sale'],['3. Process narratives','How each process should work: the yardstick'],['4. Control list','Controls expected at each step']],
 checks:[['1. Documents link in order?','Exception: chain broken'],['2. Amounts and quantities agree?','Exception: amounts differ'],['3. Described control seen?','Exception: control not seen'],['4. Accounting entry correct?','Exception: wrong entry']],
 start:'Take one purchase and one sale',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Read the narratives and draw each process as a simple chain of boxes: for purchase-to-pay, order, goods receipt, invoice, payment, accounting entry; for order-to-cash, order, delivery, invoice, payment received, accounting entry.','Mark where the narrative says each control happens.'],q:'Why draw the chain before looking at the documents?',o:['It is decoration','You then know what each step should look like and where the controls are','It saves time later'],a:1,e:'The chain is the yardstick for the documents.'},
 {t:'Stage 2: Analysing the data',pts:['Lay the documents in order. On each, find the reference to the document before it, the date, the quantity and the amount, and who created or approved it.','Check the dates run in the right order. An invoice dated before the goods arrived, or a payment before the invoice was approved, is worth asking about.'],q:'The invoice is dated before the goods were received. What do you do?',o:['Nothing','Ask about it: the order of dates is a check','Pass it'],a:1,e:'Dates that run out of order are worth asking about.'},
 {t:'Stage 3: Testing',pts:['Compare quantities and amounts across the chain. For the purchase, the three-way match should show the order, receipt and invoice agree, or that a difference was approved.','Confirm each control in the narrative is visible on the documents.','Where the real process differs from the narrative, note it; that is a valuable result even if nothing went wrong.'],q:'The invoice price is 5% above the order, and it was paid without separate approval. Result?',o:['Pass, as it was paid','Exception: amounts differ and the approval was not seen','Not applicable'],a:1,e:'The three-way match should show the difference was approved.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“PR-01 P2P and O2C”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','There are two sheets, one per process; each row is one step of the chain.'],q:'What do walkthroughs often reveal?',o:['Fraud','A detail the narrative missed, such as a matching tolerance or a step done outside the system','Nothing'],a:1,e:'They usually confirm the process.'}],
 intro:'Ten steps from one purchase (five steps) and one sale (five steps). Mark each step Pass or Exception and choose the type.',
 cols:[['Document','doc'],['Date','dt'],['Qty','qty'],['Amount','amt'],['By','by'],['Control seen','ctl'],['Agrees?','ag']],
 types:{link:'Chain broken (links or dates)',amounts:'Amounts or quantities differ',control:'Described control not seen',entry:'Wrong accounting entry'},
 rows:[
 {n:'Purchase: order',doc:'PO 4500012',dt:'2 Mar',qty:'100',amt:'10,000',by:'Buyer',ctl:'Approved by manager',ag:'Yes',res:'Pass',why:'Order approved by the manager.'},
 {n:'Purchase: goods receipt',doc:'GR 5000034',dt:'9 Mar',qty:'100',amt:'10,000',by:'Warehouse',ctl:'-',ag:'Yes',res:'Pass',why:'Quantity and amount agree to the order.'},
 {n:'Purchase: invoice',doc:'INV 81234',dt:'12 Mar',qty:'100',amt:'10,500',by:'AP Clerk',ctl:'Three-way match',ag:'No, price 5% higher',res:'Exception',type:'amounts',why:'The price is 5% above the order. The three-way match tolerates it automatically.'},
 {n:'Purchase: payment',doc:'PAY 220019',dt:'30 Mar',qty:'-',amt:'10,500',by:'Payment run',ctl:'Approved run',ag:'Paid at invoice price',res:'Exception',type:'control',why:'The price difference was paid with no separate approval of the variance. The run was approved, but the variance was not.'},
 {n:'Purchase: accounting entry',doc:'FI 400034',dt:'30 Mar',qty:'-',amt:'10,500',by:'System',ctl:'-',ag:'Posted as invoiced',res:'Pass',why:'The entry agrees to the invoice and payment.'},
 {n:'Sale: order',doc:'SO 7000077',dt:'5 Apr',qty:'50',amt:'5,000',by:'Sales rep',ctl:'Credit check done',ag:'Yes',res:'Pass',why:'Credit check visible on the order.'},
 {n:'Sale: delivery',doc:'DEL 80041',dt:'8 Apr',qty:'50',amt:'-',by:'Warehouse',ctl:'-',ag:'Yes',res:'Pass',why:'Quantity agrees to the order.'},
 {n:'Sale: invoice',doc:'INV 91550',dt:'9 Apr',qty:'50',amt:'5,000',by:'Billing',ctl:'Matched to delivery',ag:'Yes',res:'Pass',why:'Agrees to the order and delivery.'},
 {n:'Sale: payment received',doc:'RCPT 62011',dt:'28 Apr',qty:'-',amt:'5,000',by:'Cash application',ctl:'Matched to invoice',ag:'Yes',res:'Pass',why:'Agrees to the invoice.'},
 {n:'Sale: accounting entry',doc:'FI 510021',dt:'28 Apr',qty:'-',amt:'5,000',by:'System',ctl:'-',ag:'Revenue and cash correct',res:'Pass',why:'The entry agrees to the invoice and receipt.'}],
 outPrompt:'The sale is clean. In the purchase, an invoice 5% above the order was paid automatically, which the narrative does not describe. Choose the outcome.',
 outs:[['Process works as described','Documents link, amounts agree, controls seen. Understanding confirmed.'],['Minor differences','Small timing or wording differences. Note in narrative.'],['Control not seen','A described control did not happen. An exception is raised.'],['Process differs from description','The real process differs. Update the narratives and controls.']],outA:3,
 outWhy:'The system pays price differences up to 5% automatically, which the narrative does not say, so the real process differs from the description. That is a valuable walkthrough result even if no control was “broken”.',
 fnd:[
 {k:'Condition (what you found)',o:['The purchase was paid incorrectly.','An invoice 5% above the order price was paid without separate approval.','Prices differ.'],a:1,e:'The exact difference and how it was paid.'},
 {k:'Criteria (the rule it breaks)',o:['Price differences must be approved before payment.','Invoices must match orders exactly.','All payments need two signatures.'],a:0,e:'The control the narrative describes.'},
 {k:'Cause (why it happened)',o:['The matching tolerance is set at 5%.','The clerk was careless.','The supplier mistook the price.'],a:0,e:'A specific setting the company can change.'},
 {k:'Effect (why it matters)',o:['Overcharges up to 5% are paid automatically.','The invoice is higher.','Payment was slow.'],a:0,e:'The effect on every purchase within tolerance.'},
 {k:'Recommendation (what to do)',o:['Reduce the tolerance and review recent variances.','Ignore small variances.','Pay slower.'],a:0,e:'Fix the setting and look back.'}],
 model:'I follow one purchase and one sale from start to finish through their documents, checking each step links, the amounts agree, the controls happened and the accounting is right. It confirms the process works as described, or shows where it does not.',
 points:['Follow one purchase and one sale through their documents','Check each document links to the one before','Check amounts and quantities across the chain','Note where the real process differs from the narrative'],
 quiz:[
 {q:'What does a walkthrough follow?',o:['A sample of 25','One real transaction from start to finish','The whole year'],a:1,e:'It builds understanding of the process and its controls.'},
 {q:'What is the three-way match?',o:['Order, goods received and invoice agree','Three approvals','Three payments'],a:0,e:'Or a difference was approved.'},
 {q:'An invoice is dated before the goods arrived. What do you do?',o:['Ignore','Ask about it','Pass'],a:1,e:'Dates out of order are worth asking about.'},
 {q:'The invoice is 5% above the order and was paid with no approval of the difference. Result?',o:['Pass','Exception','Not applicable'],a:1,e:'Price differences must be approved before payment.'},
 {q:'What do you draw before looking at documents?',o:['A chart of staff','The process as a chain of steps with the controls marked','Nothing'],a:1,e:'It is your yardstick.'},
 {q:'The real process differs from the narrative, but nothing went wrong. Is that a result?',o:['No','Yes, it is a valuable result','Only if fraud'],a:1,e:'Update the narratives and controls.'},
 {q:'A described control did not happen. Outcome?',o:['Process works as described','Minor differences','Control not seen','Process differs from description'],a:2,e:'An exception is raised.'},
 {q:'Documents link, amounts agree and controls are seen. Outcome?',o:['Process works as described','Control not seen','Process differs from description'],a:0,e:'Understanding confirmed.'}]
},

{id:'PR-02',title:'June close: posting periods and large journals',folder:'PR-02 Financial close',
 purpose:['At each month end the accounts are closed. Two controls matter. <b>Posting periods</b> decide which months can still be posted to, and must be closed on time so the closed figures cannot change. <b>Large manual journals</b> must be approved before posting.','This test checks both for the June close.'],
 qs:['Was June closed for posting on the planned date? And not reopened without approval.','Who opened or closed periods? Only authorised staff.','Were large manual journals approved? Every journal above the limit.','Were any journals posted into June after it closed? Late postings change reported figures.'],
 files:[['1. Period status history','When each period was opened and closed, and by whom: period control'],['2. Close calendar','Planned close dates: the yardstick'],['3. June journals above the limit','Each large manual journal with poster and approver: journal control'],['4. Authorised list','Who may change periods and approve journals: authorisation']],
 checks:[['1. Closed on the planned date?','Exception: closed late'],['2. Reopened with approval?','Exception: reopened, no approval'],['3. Large journals approved first?','Exception: journal not approved'],['4. Nothing posted after close?','Exception: posted after close']],
 start:'Take the June period history and the large journals',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Note the close date and the journal limit from the policy.','Find out from the close calendar when June was meant to be closed, and from the policy what counts as a large journal and who may approve one.','Get the list of people allowed to open and close periods.'],q:'Why get the list of people allowed to change periods?',o:['To count staff','Because a period opened or closed by someone not on it is an exception','It is optional'],a:1,e:'Authorisation is part of the control.'},
 {t:'Stage 2: Analysing the data',pts:['Read the period history from the start of June to the end of July and write each event in a timeline: opened, closed, reopened, closed again, with the person and time.','List every large journal posted into June, with who posted it, who approved it and when. Compare the posting dates with the close date.'],q:'Why read the period history to the end of July?',o:['It is a habit','A reopening or late posting after the close would appear then','To check July'],a:1,e:'Events after the close are where the exceptions are.'},
 {t:'Stage 3: Testing',pts:['Pass if June closed on time, only authorised changes, every large journal approved first by someone else, and no posting after close.','Late postings into a closed month are exceptions unless a reopening was properly approved.'],q:'A 180k journal was posted into June on 8 July, after the close, with no approval. Result?',o:['Pass','Exception: not approved, and posted after close','Not applicable'],a:1,e:'Reported June figures changed after the close.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“PR-02 Financial close”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet lists period events and journals tested, with exceptions.'],q:'What is the common exception?',o:['A late close','A period reopened for a late adjustment without formal approval','A missing journal'],a:1,e:'Closes usually run to plan.'}],
 intro:'Ten items from the June close: period events and large journals (over 100k). The planned close was 5 July. Mark each Pass or Exception and choose the type.',
 cols:[['Expected','exp'],['Found','fnd']],
 types:{reopen:'Period reopened without approval',unappr:'Large journal not approved first',self:'Approved by the poster',late:'Posted into a closed period'},
 rows:[
 {n:'June closed',exp:'By 5 Jul',fnd:'5 Jul 18:00',res:'Pass',why:'Closed on the planned date.'},
 {n:'Closed by an authorised person',exp:'On the authorised list',fnd:'Financial Controller, on the list',res:'Pass',why:'Authorised.'},
 {n:'Reopened?',exp:'No',fnd:'8 Jul by T. Wells, no approval',res:'Exception',type:'reopen',why:'The period was reopened after the close by an accountant with period access, with no approval.'},
 {n:'JE 9001 (250k)',exp:'Approved before posting',fnd:'Approved 30 Jun by the Controller',res:'Pass',why:'Approved first, by someone other than the poster.'},
 {n:'JE 9012 (120k)',exp:'Approved before posting',fnd:'Approved 2 Jul by the Controller; posted 3 Jul',res:'Pass',why:'Approved first.'},
 {n:'JE 9030 (105k)',exp:'Approved before posting',fnd:'Approved 1 Jul; posted 1 Jul (approval same day, before posting)',res:'Pass',why:'Approval was the same day, but clearly before posting: reported as low risk, not an exception.'},
 {n:'JE 9031 (140k)',exp:'Approved before posting',fnd:'Approved 2 Jul by the Controller',res:'Pass',why:'Approved first.'},
 {n:'JE 9038 (115k)',exp:'Approved before posting',fnd:'Approved 3 Jul by the Controller',res:'Pass',why:'Approved first.'},
 {n:'JE 9044 (180k)',exp:'Approved before posting',fnd:'Posted 8 Jul into June, no approval',res:'Exception',type:'unappr',why:'Posted after the close with no approval at all. This is the journal that changed the reported June figures.'},
 {n:'JE 9051 (150k)',exp:'Approved by someone other than the poster',fnd:'Posted and approved by the same person',res:'Exception',type:'self',why:'Approval by the poster is not independent approval.'}],
 outPrompt:'June closed on time, but it was reopened without approval and two large journals failed, one of them posted after the close for 180k. Choose the outcome.',
 outs:[['Effective','Closed on time, no unapproved changes, all journals approved. The close was controlled.'],['Effective, minor exceptions','Approval recorded same day as posting. Reported, low risk.'],['Not effective','Unapproved reopening or journals. A finding is raised.'],['High risk','Unapproved postings after close of significant value. Serious; figures may be misstated.']],outA:2,
 outWhy:'An unapproved reopening and unapproved journals make it not effective. High risk needs unapproved postings of significant value against materiality, and 180k is a judgement for you and your senior; the manual’s own conclusion is “Not effective”.',
 fnd:[

 {k:'Criteria (the rule it breaks)',o:['Closed periods stay closed; large journals need prior approval.','Journals must be small.','June must close early.'],a:0,e:'The two controls.'},
 {k:'Cause (why it happened)',o:['A late accrual was pushed through by an accountant with period access.','The Controller was away.','The calendar was wrong.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['Reported June figures changed after close.','The close was late.','Journals were many.'],a:0,e:'The effect on reported figures.'},
 {k:'Recommendation (what to do)',o:['Restrict period access and require approval to reopen.','Close earlier.','Ban journals.'],a:0,e:'Fix the access and the approval step.'}],

 points:['Closed periods must stay closed','Only authorised people may open or close them','Large journals need prior approval by someone else','Late unapproved postings change reported figures'],
 quiz:[
 {q:'What does a posting period decide?',o:['Which months can still be posted to','Who is paid','Which reports run'],a:0,e:'Closed periods stop figures changing.'},
 {q:'June was reopened on 8 July by an unauthorised person with no approval. Result?',o:['Pass','Exception: reopened without approval','Not applicable'],a:1,e:'The common exception.'},
 {q:'A large journal was approved by the person who posted it. Result?',o:['Pass','Exception: approved by the poster','Not applicable'],a:1,e:'Approval must be by someone else.'},
 {q:'A large journal was posted into June after close with no approval. Result?',o:['Pass','Exception: not approved, posted after close','Not applicable'],a:1,e:'Reported figures changed.'},
 {q:'An approval is dated the same day as posting, clearly before it. Result?',o:['Exception','Low risk: reported, not a failure','High risk'],a:1,e:'Effective, minor exceptions.'},
 {q:'Which period events do you timeline?',o:['Opened, closed, reopened, closed again, with person and time','Only the close','Only reopenings'],a:0,e:'The timeline shows what happened when.'},
 {q:'Unapproved postings after close of significant value. Outcome?',o:['Effective','Not effective','High risk'],a:2,e:'Serious; figures may be misstated.'},
 {q:'Closed on time, no unapproved changes, all journals approved. Outcome?',o:['Effective','Not effective','High risk'],a:0,e:'The close was controlled.'}]

{id:'SD-01',title:'A new system module goes live: was it controlled?',folder:'SD-01 Go-live',

{id:'SOC-01',title:'Relying on a service organisation’s report (payroll)',folder:'SOC-01 SOC 1 reliance',

 files:[['1. SOC 1 Type II report','The provider’s auditor’s report: what we rely on'],['2. User entity controls checklist','Controls the company must perform: our side of the bargain'],['3. Evidence of the company’s controls','For example signed payroll reconciliations: proof we did our part'],['4. Bridge letter','Provider’s statement covering any gap']],

 start:'Open the SOC 1 report and our controls checklist',

 {t:'Stage 2: Analysing the data',pts:['Compare the report period with the company’s year. If the report ends before year end, check the bridge letter covers the gap.','Read the section listing exceptions the provider’s auditor found, and ask for each whether it could affect the company’s payroll.','List each user entity control, the checks the company itself must do, and find evidence the company did them for each period.'],q:'The report ends 30 September; our year ends 31 December. What do you need?',o:['Nothing','A bridge letter covering October to December','A new report'],a:1,e:'The bridge letter covers the gap.'},

var ST={},L=null,S=null;

s+='<rect x="400" y="'+y+'" width="250" height="44" rx="8" fill="'+(na?'#eef2f7':'#fbe9e3')+'" stroke="'+(na?'#5b6b7b':'#a63a1f')+'"/><text x="525" y="'+(y+26)+'" text-anchor="middle">'+c[1]+'</text>'});
s+='<rect x="60" y="'+py+'" width="250" height="44" rx="8" fill="#e3f4ec" stroke="#17724a"/><text x="185" y="'+(py+26)+'" text-anchor="middle">'+(L.flowEnd||'All Yes: result is Pass')+'</text></svg>';return s}

if(S.rowsChecked)h+='<div class="fb '+(ok(i)?'ok':'no')+'">'+(ok(i)?'Correct. ':'Correct answer: '+r.res+(r.type?' ('+L.types[r.type]+'). ':'. '))+r.why+'</div>';
h+='</div>'});
h+='</div>';
if(!S.rowsChecked)h+='<div class="nav"><button onclick="go(1)">Back</button><button class="pri" onclick="chkRows()">Check my answers</button></div><p class="err" id="e2"></p>';
else{var n=L.rows.filter(function(r,i){return ok(i)}).length,P=0,A=0,E=0,T={};L.rows.forEach(function(r){if(r.res=='Pass')P++;else if(r.res=='Exception'){E++;T[r.type]=(T[r.type]||0)+1}else A++});

function chkRows(){for(var i=0;i<L.rows.length;i++){var a=S.rows[i];if(!a||!a.res||(a.res=='Exception'&&!a.type)){$('e2').textContent='Complete every row first (row '+(i+1)+', '+L.rows[i].n+', is not finished).';return}}S.rowsChecked=true;render();window.scrollTo(0,0)}

function r3(){
var h='<div class="card"><h2>What is your conclusion?</h2><p>'+L.outPrompt+'</p>';
L.outs.forEach(function(o,i){var c='opt';if(S.outChecked){if(i==L.outA)c+=' ok';else if(i==S.out)c+=' no'}
h+='<button class="'+c+'" '+(S.outChecked?'disabled':'')+' onclick="po('+i+')"><b>'+o[0]+'</b><br><span style="font-size:14px;color:var(--mut)">'+o[1]+'</span></button>'});
if(S.outChecked)h+='<div class="fb '+(S.out==L.outA?'ok':'no')+'">'+(S.out==L.outA?'Correct. ':'The answer is '+L.outs[L.outA][0]+'. ')+L.outWhy+'</div>';
$('app').innerHTML=h+'</div>'+nav(true,S.outChecked)}
function po(i){S.out=i;S.outChecked=true;render()}

function r4(){
var h='<div class="card"><h2>Write the finding</h2><p>Management receives your finding, so each part must be right. Choose the best sentence for each part.</p></div>';
L.fnd.forEach(function(f,i){var d=S.fnd[i];h+='<div class="card"><h3>'+f.k+'</h3>';
f.o.forEach(function(o,j){var c='opt';if(S.fndChecked){if(j==f.a)c+=' ok';else if(j==d)c+=' no'}else if(j==d)c+=' sel';
h+='<button class="'+c+'" '+(S.fndChecked?'disabled':'')+' onclick="pf('+i+','+j+')">'+o+'</button>'});
if(S.fndChecked)h+='<div class="fb '+(d==f.a?'ok':'no')+'">'+(d==f.a?'Correct. ':'Not the best choice. ')+f.e+'</div>';h+='</div>'});
if(!S.fndChecked)h+='<div class="nav"><button onclick="go(3)">Back</button><button class="pri" onclick="chkF()">Check my finding</button></div><p class="err" id="e4"></p>';else h+=nav(true,true);
$('app').innerHTML=h}
function pf(i,j){S.fnd[i]=j;render()}
function chkF(){if(Object.keys(S.fnd).length<L.fnd.length){$('e4').textContent='Choose a sentence for all five parts first.';return}S.fndChecked=true;render();window.scrollTo(0,0)}

function r5(){
var h='<div class="card"><h2>Explain it in two minutes</h2><p>If you can explain a test to a friend in two minutes, you understand it. Write (or say aloud, then type) your explanation of '+L.id+' in your own words.</p><textarea id="tb" placeholder="Start here...">'+esc(S.tb)+'</textarea><p class="err" id="e5"></p>';
if(!S.tbShown)h+='<button class="pri" onclick="showTb()">Compare with the model answer</button>';
else h+='<div class="fb info"><b>Model answer.</b> '+L.model+'</div><h3>Did you cover these points?</h3><ul>'+L.points.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul>';
h+='</div>'+(S.tbShown?nav(true,true,'Take the quiz'):'<div class="nav"><button onclick="go(4)">Back</button></div>');
$('app').innerHTML=h}
function showTb(){var v=$('tb').value.trim();if(v.length<40){$('e5').textContent='Write at least a few sentences first (40 characters or more).';return}S.tb=v;S.tbShown=true;render()}

function r6(){
var Q=L.quiz;
if(S.qdone){var pass=S.score>=7;$('app').innerHTML='<div class="card"><h2>Quiz result: '+S.score+' of '+Q.length+'</h2><div class="fb '+(pass?'ok':'no')+'">'+(pass?'Mastery gate passed (7 of 8 needed). '+L.id+' is complete.':'You need 7 of 8 to pass the gate. Review the walkthrough and try again.')+'</div><div class="nav"><button onclick="go(1)">Review walkthrough</button><button class="pri" onclick="S.qi=0;S.qans=[];S.qsh=[];S.qdone=false;S.score=0;render()">Retake quiz</button></div></div><div class="nav"><button onclick="goHome()">All lessons</button><span></span></div>';return}
var q=Q[S.qi],a=S.qans[S.qi];if(!S.qsh[S.qi])S.qsh[S.qi]=shuf(q.o);
var h='<div class="card"><span class="tag">Question '+(S.qi+1)+' of '+Q.length+'</span><h2 style="margin-top:8px">'+q.q+'</h2>';
S.qsh[S.qi].forEach(function(o){var c='opt';if(a!==undefined){if(o.i==q.a)c+=' ok';else if(o.i==a)c+=' no'}h+='<button class="'+c+'" '+(a!==undefined?'disabled':'')+' onclick="qa('+o.i+')">'+o.t+'</button>'});
if(a!==undefined)h+='<div class="fb '+(a==q.a?'ok':'no')+'">'+(a==q.a?'Correct. ':'Not quite. ')+q.e+'</div><div class="nav"><span></span><button class="pri" onclick="qn()">'+(S.qi==Q.length-1?'See result':'Next question')+'</button></div>';
$('app').innerHTML=h+'</div>'}
function qa(i){S.qans[S.qi]=i;if(i==L.quiz[S.qi].a)S.score++;render()}
function qn(){if(S.qi==L.quiz.length-1){S.qdone=true;saveProg(L.id,S.score)}else S.qi++;render();window.scrollTo(0,0)}

var sb=null,DB={},USR=null,SBST='load',SBMSG='';
function initSb(){try{var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
sc.onload=function(){try{sb=window.supabase.createClient(SBURL,SBKEY);SBST='ok';sb.auth.getSession().then(function(r){USR=r&&r.data&&r.data.session?r.data.session.user:null;loadDB()},function(){loadDB()})}catch(e){SBST='fail';if(!L)render()}};
sc.onerror=function(){SBST='fail';if(!L)render()};document.head.appendChild(sc)}catch(e){SBST='fail'}}
function loadDB(){if(!sb||!USR){DB={};if(!L)render();return}
sb.from('lesson_progress').select('lesson_id,best_score,last_score,attempts,completed').then(function(r){DB={};((r&&r.data)||[]).forEach(function(x){DB[x.lesson_id]=x});if(!L)render()},function(){if(!L)render()})}
function saveProg(id,score){if(!sb||!USR)return;var o=DB[id]||{best_score:0,attempts:0,completed:false};
var row={user_id:USR.id,lesson_id:id,best_score:Math.max(o.best_score,score),last_score:score,attempts:o.attempts+1,completed:!!o.completed||score>=7,updated_at:new Date().toISOString()};DB[id]=row;
sb.from('lesson_progress').upsert(row,{onConflict:'user_id,lesson_id'}).then(function(r){SBMSG=(r&&r.error)?'Your result could not be saved. Check your connection and retake the quiz.':''},function(){SBMSG='Your result could not be saved. Check your connection and retake the quiz.'})}
function logv(id){try{if(sb&&USR)sb.from('app_visit_log').insert({app:'lessons',page:id,event:'view'}).then(function(){},function(){})}catch(e){}}
function doSignIn(){var e=$('lg_e').value.trim(),p=$('lg_p').value;if(!e||!p){$('lg_m').textContent='Enter your email and password.';return}
$('lg_m').textContent='Signing in...';
sb.auth.signInWithPassword({email:e,password:p}).then(function(r){if(r.error||!r.data||!r.data.user){$('lg_m').textContent='Sign-in failed. Check your email and password.';return}USR=r.data.user;loadDB()},function(){$('lg_m').textContent='Could not reach the sign-in service.'})}
function doSignOut(){sb.auth.signOut().then(function(){USR=null;DB={};render()},function(){})}
function authCard(){
if(SBST==='load')return '';
if(SBST==='fail'||!sb)return '<div class="card"><p style="margin:0;color:var(--mut)">Progress saving is not available right now. The lessons work, but your scores are not stored.</p></div>';
if(USR)return '<div class="card"><p style="margin:0">Signed in as <b>'+esc(USR.email||'')+'</b>. Your quiz scores and completed lessons are saved.</p>'+(SBMSG?'<p style="color:#a63a1f">'+SBMSG+'</p>':'')+'<div class="nav"><span></span><button onclick="doSignOut()">Sign out</button></div></div>';
return '<div class="card"><h3 style="margin-top:0">Sign in to save your progress</h3><p>Use the same email and password as the course app. You can use the lessons without signing in, but your scores will not be saved.</p><input id="lg_e" type="email" placeholder="Email" autocomplete="username" class="lgi"><input id="lg_p" type="password" placeholder="Password" autocomplete="current-password" class="lgi"><p id="lg_m" style="color:#a63a1f;margin:6px 0"></p><button class="pri" onclick="doSignIn()">Sign in</button></div>'}
initSb();render();
</script>
