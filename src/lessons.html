<style>
:root{--navy:#14304f;--blue:#1d5fa8;--bg:#f4f6f9;--card:#fff;--line:#d8dee6;--ink:#1c2733;--mut:#5b6b7b;--ok:#17724a;--okbg:#e3f4ec;--bad:#a63a1f;--badbg:#fbe9e3;--ambbg:#fdf2d9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header small{opacity:.8;display:block;font-size:12px;letter-spacing:.04em}
header h1{margin:2px 0 0;font-size:17px;font-weight:600}
header button{background:transparent;color:#fff;border-color:#fff;min-height:36px;padding:6px 10px;font-size:14px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:12px 12px 48px}
.prog{display:flex;gap:4px;margin:8px 0 14px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.done{background:var(--blue)}.prog span.cur{background:var(--navy)}
.stepname{font-size:13px;color:var(--mut);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin:0 0 8px;color:var(--navy)}h3{font-size:16px;margin:14px 0 6px;color:var(--navy)}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:10px 14px;min-height:44px}
button.pri{background:var(--blue);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
button.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0;min-height:1em}
.opt{display:block;width:100%;text-align:left;margin:6px 0;border-color:var(--line);color:var(--ink)}
.opt.sel{color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--okbg);color:#0d4a2f}.fb.no{background:var(--badbg);color:#6e2410}.fb.info{background:var(--ambbg);color:#5a3a00}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.row{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.row dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.row dt{color:var(--mut)}.row dd{margin:0}
.row.good{border-color:var(--ok)}.row.bad{border-color:var(--bad)}
select{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);width:100%;margin-top:6px;min-height:44px}
textarea{font:inherit;width:100%;min-height:130px;padding:10px;border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}th{background:#eef2f7}
svg{width:100%;height:auto;display:block}
svg text{font-family:inherit;font-size:13px;fill:#14304f}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef2f7;color:var(--mut)}
.tag.done{background:var(--okbg);color:var(--ok)}
.lrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (min-width:600px){header h1{font-size:20px}.card{padding:20px}}
@media (min-width:880px){.grid{grid-template-columns:1fr 1fr}header,main{padding-left:24px;padding-right:24px}}
</style>
<style>.lgi{display:block;width:100%;max-width:380px;margin:6px 0;padding:10px;border:1px solid var(--bd,#b8c2cc);border-radius:8px;font:inherit}</style>

<script>
var STEPS=['Brief','Walkthrough','Do the test','Decide','Write','Teach-back','Quiz'];
var OUTT={
 ok0:'Effective, no exceptions',ok1:'Effective, minor exceptions',ne:'Not effective',hr:'Not effective, high risk',rr:'Not effective, risk realised'};

var LESSONS=[
{id:'AC-01',title:'Giving new access only after it is approved',folder:'AC-01 Provisioning',
 purpose:['When someone needs access to the financial system, a manager should approve the request <b>before</b> IT gives the access.','Access given without approval may be more than the person needs, and nobody has taken responsibility for it.','The company says every request goes through a ticket, the right manager approves it, and only then does IT set up the access.'],
 qs:['Was there a request at all?','Was it approved by the right person (not the user)?','Was it approved <b>before</b> the access was given?','Does the access given match the access approved?'],
 files:[['1. New access list','The population: everything the control should have covered'],['2. Request tickets','Proof of approval to match against'],['3. Approver list','Whether the approver was allowed to say yes'],['4. Control description','The yardstick']],
 checks:[['1. Is there a ticket?','No ticket'],['2. Right approver, not the user?','Wrong approver or self'],['3. Approved before access given?','Approved late'],['4. Access matches the request?','More access than asked']],
 start:'Take one item from the new access list',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Check the new access list covers the whole year and count its rows.','If the list is long, agree with your senior whether to test everything or sample (for example 25 items spread across the year). Note the method.','Confirm the approver list is the one in force during the year, not just today’s.'],q:'The approver list you were given is dated last week. What do you do?',o:['Use it, because it is the latest','Ask for the list as it stood during the year, or confirm it did not change','Skip the approver check'],a:1,e:'An approver who is allowed today may not have been allowed in March. You need the list in force during the year.'},
 {t:'Stage 2: Analysing the data',pts:['Match each item on the new access list to its ticket, using the user name and the role.','Put the date access was given next to the approval date and the approver’s name.','Look the approver up on the approver list.','Compare the role on the ticket with the role actually given.'],q:'Which pair of facts proves approval came first?',o:['Role given and role requested','Date (and time) access was given, next to date (and time) of approval','Ticket number and user name'],a:1,e:'Timing is the whole point of “first”. When both fall on the same day, compare the times.'},
 {t:'Stage 3: Testing',pts:['Pass only if a ticket exists, the approver was allowed, approval came first and the access matches.','Anything else is an exception: no ticket, wrong approver, self-approval, approval after the access, or more access than requested.','Ask the company about each exception and save their answer as PDF.'],q:'IT says an item was urgent and was set up from a phone call. How do you mark it?',o:['Pass, because it was urgent','Exception, then ask the company and save their answer as PDF','Delete the row'],a:1,e:'Urgency explains an exception. It does not remove it. You record it, ask, and keep the answer as evidence.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-01 Provisioning”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','Your own work goes in the Excel working table and the Word working paper.'],q:'Where do you do your marking and counting?',o:['In the files you were given, to save time','In your own working table, kept separate from the evidence','Directly in the working paper'],a:1,e:'Evidence is kept exactly as received so anyone can check your work. Your analysis lives in your own working table.'}],
 intro:'Ten new access items, each already matched to its ticket. For each one, mark Pass or Exception. If it is an exception, choose the type. Compare times as well as dates.',
 cols:[['Role given','role'],['Given','given'],['Ticket','ticket'],['Role requested','req'],['Approver','appr'],['Approved','apprOn'],['On approver list?','list']],
 types:{ticket:'No ticket',who:'Wrong approver or self-approval',late:'Approved after access was given',extra:'More access than requested'},
 rows:[
 {n:'J. Okafor',role:'AP Clerk',given:'12 Feb',ticket:'RITM 1043',req:'AP Clerk',appr:'M. Shah',apprOn:'10 Feb',list:'Yes, on list',res:'Pass',why:'Ticket exists, approver allowed, approved two days before access, role matches.'},
 {n:'L. Grant',role:'GL Journal Poster',given:'3 May',ticket:'RITM 1188',req:'GL Journal Poster',appr:'L. Grant',apprOn:'3 May',list:'No, the user herself',res:'Exception',type:'who',why:'She approved her own request. The approver must be the manager or access owner. Sensitive access (journals).'},
 {n:'P. Diaz',role:'Vendor Maintenance',given:'19 Aug',ticket:'none',req:'-',appr:'-',apprOn:'-',list:'-',res:'Exception',type:'ticket',why:'No ticket at all, so nothing shows the access was requested or approved. Sensitive access (vendors).'},
 {n:'A. Romero',role:'AR Clerk',given:'7 Mar, 09:00',ticket:'RITM 1090',req:'AR Clerk',appr:'D. Weiss',apprOn:'5 Mar, 16:20',list:'Yes, on list',res:'Pass',why:'Every check is met, and approval came first.'},
 {n:'S. Nair',role:'AP Clerk + Payment Release',given:'21 Jun',ticket:'RITM 1241',req:'AP Clerk',appr:'M. Shah',apprOn:'18 Jun',list:'Yes, on list',res:'Exception',type:'extra',why:'IT gave Payment Release, which was never requested. The access given must match exactly what was approved. Sensitive access (payments).'},
 {n:'T. Brooks',role:'Treasury Analyst',given:'14 Jul, 09:15',ticket:'RITM 1266',req:'Treasury Analyst',appr:'K. Obi',apprOn:'14 Jul, 11:40',list:'Yes, on list',res:'Exception',type:'late',why:'Approval came 2 hours after the access was given. The control is meant to prevent, not tidy up. Small slip, but still an exception.'},
 {n:'R. Chen',role:'GL Reviewer',given:'2 Sep',ticket:'RITM 1302',req:'GL Reviewer',appr:'F. Lowe',apprOn:'1 Sep',list:'Yes, on list',res:'Pass',why:'Every check is met.'},
 {n:'M. Bello',role:'Procurement Buyer',given:'10 Oct',ticket:'RITM 1330',req:'Procurement Buyer',appr:'C. Hart',apprOn:'9 Oct',list:'No, not on the list for this role',res:'Exception',type:'who',why:'C. Hart is not allowed to approve this kind of access. An approval from the wrong person is not an approval.'},
 {n:'H. Ito',role:'AP Clerk',given:'4 Nov',ticket:'RITM 1351',req:'AP Clerk',appr:'M. Shah',apprOn:'3 Nov',list:'Yes, on list',res:'Pass',why:'Every check is met.'},
 {n:'E. Zhou',role:'AR Clerk',given:'18 Dec, 13:00',ticket:'RITM 1399',req:'AR Clerk',appr:'D. Weiss',apprOn:'18 Dec, 08:30',list:'Yes, on list',res:'Pass',why:'Same day, but approval (08:30) came before the access (13:00). Compare the times, not just the dates.'}],
 outPrompt:'The exceptions include journal posting, vendor maintenance and payment release access. Choose the outcome.',
 outs:[['Effective, no exceptions','Every item has a ticket, approved first by an allowed approver, and the access matches.'],['Effective, minor exceptions','A small number of paperwork slips with a clear explanation. Reported, usually low risk.'],['Not effective','Missing tickets, self-approval or approvers who were not allowed. A finding is raised.'],['Not effective, high risk','Unapproved access to sensitive things such as posting journals, paying suppliers or changing bank details.']],outA:3,
 outWhy:'Unapproved access to sensitive things (journals, vendors, payments) makes this serious, and the company should check what these users did with the access.',
 fnd:[
 {k:'Condition (what you found)',o:['Five of 10 items were not properly approved: one self-approved, one without a ticket, one approved late, one with extra access, one approved by someone not on the list.','Access control at the company is poor.','The ticket tool is badly designed.'],a:0,e:'A condition states facts and counts. Opinions go nowhere in this part.'},
 {k:'Criteria (the rule it breaks)',o:['IT should work faster on access requests.','Access must be approved by the user’s manager or access owner before it is given, and must match the request.','All access should be reviewed every quarter.'],a:1,e:'Criteria are the company’s own rule, as in the control description.'},
 {k:'Cause (why it happened)',o:['The employees were careless.','Nobody knows.','The ticket tool does not stop self-approval, and IT set up some requests without a matching approved ticket.'],a:2,e:'A cause is something the company can change. Confirm it with the company before you write it.'},
 {k:'Effect (why it matters)',o:['The audit will take longer.','People may hold access no manager agreed to, including posting journals, changing vendors and releasing payments.','IT will receive more tickets.'],a:1,e:'The effect explains the risk to the company’s figures, not the inconvenience to you.'},
 {k:'Recommendation (what to do)',o:['Tell everyone to be more careful.','Block self-approval in the ticket tool, require an approved ticket before IT acts, and review what the affected users did with the access.','Remove all IT administrators.'],a:1,e:'A good recommendation is specific, fixes the cause, and checks what has already happened.'}],
 model:'When someone gets new access, a manager should have approved it first. I take the list of everything given out this year, match each item to its request ticket, and check who approved it, when, and whether IT gave exactly what was asked for. If every item was approved first by the right person, the control works. Missing or late approvals are exceptions, and access given without approval to sensitive areas is a serious finding.',
 points:['A manager approves before access is given','Take the list, match to tickets','Check who, when, and exactly what was given','Missing or late approval is an exception; sensitive access is serious'],
 quiz:[
 {q:'What is the population for AC-01?',o:['The request tickets','The new access list (every new account and role given during the year)','The approver list'],a:1,e:'The population is everything the control should have covered. You test from it, and match to tickets.'},
 {q:'When must the approval happen?',o:['Before the access is given','Within three business days after','Any time in the same month'],a:0,e:'Approval after set-up is too late: the control is meant to prevent, not tidy up.'},
 {q:'L. Grant was given GL Journal Poster on 3 May. Ticket RITM 1188 shows L. Grant as approver, same day. Result?',o:['Pass, because a ticket exists','Exception: self-approval','Pass, because approval is dated the same day','Not applicable'],a:1,e:'The approver must be the user’s manager or the access owner, never the user.'},
 {q:'Access was given on 14 July at 09:15. The approval is time-stamped 14 July 11:40. Result?',o:['Pass, same day','Exception: approved after the access was given','Not applicable','Pass, if the approver is allowed'],a:1,e:'11:40 is after 09:15. Comparing dates alone would miss this.'},
 {q:'The ticket asks for AP Clerk. IT gave AP Clerk plus Payment Release. Result?',o:['Pass, since AP Clerk was approved','Exception: more access than requested','Pass, since IT is the expert','Exception: no ticket'],a:1,e:'IT must give exactly what was asked for, and not extra.'},
 {q:'Approval is time-stamped 08:30 on 18 Dec. Access was given at 13:00 the same day, and everything else is correct. Result?',o:['Exception: approved on the same day','Pass','Exception: no ticket','Not applicable'],a:1,e:'Approval came first. Same date does not mean late, so compare the times.'},
 {q:'You tested 25 items: 23 passed. The 2 exceptions are a self-approval and a missing ticket, both for journal-posting and vendor access. What is the conclusion?',o:['Effective, no exceptions','Effective, minor exceptions','Not effective','Not effective, high risk'],a:3,e:'Unapproved access to sensitive things such as posting journals or changing vendors is the high-risk case.'},
 {q:'You tested 25 items: 24 passed. In one, approval was recorded a few hours after set-up, and the company gave a clear written explanation. What is the likely conclusion?',o:['Effective, minor exceptions','Not effective, high risk','Not effective','Effective, no exceptions'],a:0,e:'A small paperwork slip with a clear explanation is reported but usually low risk.'}]
},

{id:'AC-02',title:'Removing access when people leave',folder:'AC-02 Terminations',
 purpose:['When an employee leaves, their access to the financial system should be switched off quickly. In this company the limit is <b>three business days</b>.','A former employee who can still log in is a risk, and anything done under that name would be hard to trace to the real person.','The company says HR tells IT when someone leaves and IT switches off the account. This test checks that this worked for everyone who left during the year.'],
 qs:['Was the account switched off at all? An account still active for a leaver is the most serious finding.','Was it switched off in time? Late is a smaller problem, but it still breaks the rule.','Was the account used after the person left? If so, the risk actually happened.'],
 files:[['1. Leavers list','Everyone who left in the year, from HR: the full population'],['2. User list','Every account, and whether and when it was locked'],['3. Last log-in report','When each account was last used'],['4. Control description','Who does what, and the time limit']],
 checks:[['1. Leaver has an account?','Not applicable: keep the row'],['2. Was it locked at all?','Exception: never locked'],['3. Locked within 3 business days?','Exception: locked late'],['4. No log-in after the last day?','Exception: used after leaving']],
 start:'Take one leaver from the HR list',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Check the leavers list covers the whole year and count its rows.','Confirm the control description gives a time limit. If not, ask before going further, because every judgement depends on it.'],q:'The control description gives no time limit for locking accounts. What do you do?',o:['Assume three days and carry on','Ask the company for the limit before going further','Use the longest limit you have seen'],a:1,e:'Every judgement of “late” depends on the limit, so you need it in writing first.'},
 {t:'Stage 2: Analysing the data',pts:['Match each leaver to their account.','Put the last day of work, the lock date and the last log-in side by side, then work out the days to lock and whether there was any log-in after the last day.','Leavers with no account stay in the table, marked “no account”, so nobody silently drops out.'],q:'A leaver has no system account at all. What do you do with the row?',o:['Delete it, as there is nothing to test','Keep it in the table, marked “no account”','Mark it as an exception'],a:1,e:'Keeping the row proves you covered everyone on the HR list. The result is Not applicable, not an exception.'},
 {t:'Stage 3: Testing',pts:['Each leaver is on time, late, never switched off, or has no account.','For late and never cases, check the last log-in.','Ask the company to explain each exception. A wrong leaving date or a rehire can clear it if they prove it.'],q:'The company says an exception was really a rehire, so the account was meant to stay open. What do you do?',o:['Clear the exception on their word','Clear it only if they prove it with evidence, and save the proof','Leave it as an exception and ignore the explanation'],a:1,e:'A rehire or wrong leaving date can clear an exception, but only when proven. Their word is not evidence.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-02 Terminations”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts leavers in each group: on time, late, never switched off, used after leaving, no account.'],q:'Which three dates do you place side by side for each leaver?',o:['Hire date, last day, lock date','Last day of work, lock date, last log-in','Ticket date, lock date, approval date'],a:1,e:'These three give you days to lock and whether anyone used the account after leaving.'}],
 intro:'Ten leavers from the HR list, each matched to their account. The limit is three business days. Mark each row Pass, Exception or Not applicable (no account). For an exception, choose the type.',
 cols:[['Last day','last'],['Account','acct'],['Locked on','locked'],['Business days to lock','days'],['Log-in after leaving?','login']],
 na:true,
 types:{late:'Locked late',never:'Never locked (not used)',used:'Used after leaving'},
 rows:[
 {n:'R. Mensah',last:'14 Mar',acct:'RMENSAH',locked:'14 Mar',days:'0',login:'No',res:'Pass',why:'Locked on the last day, no log-in afterwards.'},
 {n:'T. Byrne',last:'30 Jun',acct:'TBYRNE',locked:'7 Jul',days:'5',login:'No',res:'Exception',type:'late',why:'Locked 5 business days after leaving, over the three-day limit. Not used, so the risk did not happen, but the rule was broken.'},
 {n:'A. Kowal',last:'22 Sep',acct:'AKOWAL',locked:'still active',days:'-',login:'Yes, 3 Oct',res:'Exception',type:'used',why:'Never locked and logged in after leaving. This is the most serious type: the risk actually happened.'},
 {n:'S. Ruiz',last:'10 Nov',acct:'none',locked:'-',days:'-',login:'-',res:'Not applicable',why:'No account, so there was nothing to switch off. Keep the row so nobody drops out silently.'},
 {n:'D. Patel',last:'5 Feb',acct:'DPATEL',locked:'7 Feb',days:'2',login:'No',res:'Pass',why:'Locked within three business days, no log-in after.'},
 {n:'N. Osei',last:'12 Apr',acct:'NOSEI',locked:'15 Apr',days:'3',login:'No',res:'Pass',why:'Exactly three business days is within the limit.'},
 {n:'G. Rossi',last:'30 May',acct:'GROSSI',locked:'still active',days:'-',login:'No',res:'Exception',type:'never',why:'Never locked. Even though nobody used it, any account never locked is an exception.'},
 {n:'M. Lund',last:'18 Aug',acct:'MLUND',locked:'25 Aug',days:'5',login:'No',res:'Exception',type:'late',why:'Locked 5 business days after leaving, over the limit.'},
 {n:'C. Baker',last:'9 Oct',acct:'CBAKER',locked:'9 Oct',days:'0',login:'No',res:'Pass',why:'Locked on the last day, no log-in afterwards.'},
 {n:'W. Tan',last:'14 Dec',acct:'WTAN',locked:'15 Dec',days:'1',login:'No',res:'Pass',why:'Locked within the limit, no log-in afterwards.'}],
 outPrompt:'One account was used after its owner left, one was never locked, and two were locked late. Choose the outcome.',
 outs:[['Effective, no exceptions','Every leaver with an account was locked in time and nobody logged in afterwards.'],['Effective, minor exceptions','One or two locked a few days late, none used. Reported as low risk.'],['Not effective','Several late, or any never locked, even if unused. A finding is raised.'],['Not effective, risk realised','Any account used after its owner left. The most serious outcome.']],outA:3,
 outWhy:'Any account used after its owner left is the most serious outcome, and the company must check what was done with the account.',
 fnd:[
 {k:'Condition (what you found)',o:['One leaver’s account was never locked and was used after she left; others were locked two to five days past the limit.','The leaver process does not work well.','HR is slow.'],a:0,e:'State what you found with counts and facts, not opinions.'},
 {k:'Criteria (the rule it breaks)',o:['Leavers should be removed as soon as possible.','Accounts must be locked within three business days of leaving.','HR must tell IT every month.'],a:1,e:'The criteria is the company’s own stated rule, including its time limit.'},
 {k:'Cause (why it happened)',o:['IT is understaffed.','HR sent the leavers notice to a shared mailbox that was not checked during the summer.','People forget things.'],a:1,e:'A good cause is a specific gap the company can fix. Confirm it with them first.'},
 {k:'Effect (why it matters)',o:['A former employee’s name was used to access financial data, and nobody knows who did it.','The tester had more work.','Some accounts cost licence fees.'],a:0,e:'The effect is the risk to the company, here untraceable activity under a former employee’s name.'},
 {k:'Recommendation (what to do)',o:['Investigate the log-in, send leaver notices straight to the ticket tool, and check open leaver accounts weekly.','Fire the HR team.','Lock all accounts every Friday.'],a:0,e:'Check what happened, fix the cause, and add a regular check.'}],
 model:'When people leave, their access should be switched off quickly. I match the HR leavers list to the system accounts and check whether each account was locked, how long it took, and whether anyone used it after the person left. On time for everyone means the control works. Late cases are reported. An account never locked, or used after leaving, is a serious finding.',
 points:['Match the HR leavers list to system accounts','Check whether, and how fast, each was locked','Check for use after leaving','Late is reported; never locked or used is serious'],
 quiz:[
 {q:'What is the population for AC-02?',o:['The user list','The HR leavers list','The last log-in report'],a:1,e:'The leavers list from HR is everyone who should have been covered. Every leaver on it stays in the table.'},
 {q:'Which single result is the most serious?',o:['An account locked five days late','A leaver with no account','An account used after the person left','An account locked on the last day'],a:2,e:'Use after leaving means the risk actually happened and the company must check what was done.'},
 {q:'Last day 30 June. Account locked 7 July, which is 5 business days later. No log-in afterwards. The limit is three. Result?',o:['Pass','Exception: locked late','Not applicable','Exception: used after leaving'],a:1,e:'Five business days is over the limit of three. It was not used, so it is late, not used-after-leaving.'},
 {q:'Last day 12 April. Account locked 15 April, which is exactly 3 business days later. Result?',o:['Pass','Exception: locked late','Not applicable','Exception: never locked'],a:0,e:'“Within three business days” includes the third day.'},
 {q:'S. Ruiz is on the HR leavers list but has no account in the system. What is the result?',o:['Exception','Pass','Not applicable, and the row stays in the table','Delete the row'],a:2,e:'Nothing needed switching off. The row stays so nobody drops out silently.'},
 {q:'An account was never locked, and the last log-in is 11 days after she left. Result?',o:['Exception: used after leaving','Exception: locked late','Pass, if the user is a manager','Not applicable'],a:0,e:'Used after leaving is the most serious type of exception.'},
 {q:'63 leavers: 52 on time, 4 late, 1 never locked and used after leaving, 6 with no account. What is the conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, risk realised','Effective, no exceptions'],a:2,e:'Any account used after its owner left makes the outcome risk realised.'},
 {q:'Two leavers were locked a few days late. Neither account was used. Everything else is clean. Likely conclusion?',o:['Effective, minor exceptions','Not effective, risk realised','Not effective','Effective, no exceptions'],a:0,e:'One or two a few days late, none used, is reported as low risk.'}]
},

{id:'AC-03',title:'Keeping all-powerful access to a small, approved group',folder:'AC-03 Privileged access',

 qs:['Who holds privileged access? You build the full list.','Is each person on the approved list?','Does each person still need it? Someone who changed job should have lost it.','Are any of them generic or test accounts? All-powerful access on an account nobody owns is especially risky.'],
 files:[['1. Privileged access list','Every account holding privileged access: the population'],['2. Approved list','The people approved to hold it, and why'],['3. Staff list','Each person’s current job and department'],['4. Control description','The company’s rule on who may hold it']],
 checks:[['1. Is the owner a named person?','Exception: no named owner'],['2. On the approved list?','Exception: not approved'],['3. Still in a job that needs it?','Exception: no longer needed']],

 {t:'Stage 2: Analysing the data',pts:['For each account, look the owner up on the approved list and on the staff list.','Note their job, whether they are approved, and the reason given.','Mark any account that has no named owner.'],q:'An account holds full access but has no named owner. What do you do?',o:['Skip it, as nobody can be asked','Mark it, as it is an exception whatever else is true','Assume it belongs to IT'],a:1,e:'An account nobody owns cannot be approved or held responsible, so it is always an exception.'},
 {t:'Stage 3: Testing',pts:['Pass means approved, still in a job that needs the access, and owned by a real person.','Exceptions are people not on the approved list, people who have moved job, and unowned accounts.','Ask about each and record the answer.'],q:'An account owner is on the approved list but moved to an HR job six months ago. Result?',o:['Pass, because they are approved','Exception: they no longer need it','Not applicable'],a:1,e:'Approved once does not mean approved forever. Someone who changed job should have lost the access.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-03 Privileged access”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet shows how many accounts hold privileged access, how many are approved, and the exceptions by type.'],q:'Which comparison finds people who no longer need the access?',o:['Privileged list against the approver list','Privileged list against the staff list (their current job)','Privileged list against last year’s list'],a:1,e:'The staff list shows each person’s current job, which tells you whether the need has lapsed.'}],

{id:'AC-04',title:'Reviewing emergency access sessions within five business days',folder:'AC-04 Firefighter',
 purpose:['Sometimes support staff need extra power for a short time to fix an urgent problem. Companies handle this with emergency access (often called firefighter access): the person borrows a powerful account, everything is logged, and afterwards someone independent reads the log.','The company says every emergency session is reviewed within <b>five business days</b>.','This test checks the reviews happened, on time, by the right person, and that they looked at what was actually done.'],
 qs:['Was every session reviewed?','Was it reviewed within five business days?','Was the reviewer independent? People must not review their own sessions.','Did the activity match the reason given?'],
 files:[['1. Session log','Every emergency session: who, when, reason and activities: the population'],['2. Review records','Reviewer, review date and comments'],['3. Reviewer list','Who is allowed to review'],['4. Control description','The five-day rule and who reviews']],
 checks:[['1. Was it reviewed at all?','Exception: not reviewed'],['2. Within five business days?','Exception: reviewed late'],['3. Independent, allowed reviewer?','Exception: self or wrong reviewer'],['4. Activity fits the reason?','Exception: activity does not fit']],
 start:'Take one emergency session from the log',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Count the sessions and check the log covers the full year.','Agree how you count business days (weekends and public holidays excluded) and note it.'],q:'A session ended on Thursday 20th. With no holidays, what is the last day for a review within five business days?',o:['Tuesday','Thursday of the following week','Friday of the following week'],a:1,e:'Friday, Monday, Tuesday, Wednesday, Thursday: five business days ends the following Thursday.'},
 {t:'Stage 2: Analysing the data',pts:['Match each session to its review.','Work out the business days between session end and review.','Compare the reviewer with the session user and with the reviewer list.','Read the activities and set them beside the reason given.'],q:'Which three comparisons do you make for each session?',o:['Review date to session end; reviewer to user and list; activities to reason','Session user to approver list; ticket to role; date to date','Reviewer to manager; reason to job title; log to log'],a:0,e:'Timing, independence and whether the activity fits the reason are the three tests.'},
 {t:'Stage 3: Testing',pts:['Pass means reviewed, on time, by an allowed independent reviewer, with activity that fits the reason.','Exceptions are missing, late or self reviews, and sessions where the activity goes beyond the reason without comment from the reviewer.'],q:'A session was reviewed on time, but it was opened to fix a printer and changed supplier bank details. The reviewer did not comment. Result?',o:['Pass, because it was reviewed on time','Exception: the activity does not fit the reason and was not challenged','Not applicable'],a:1,e:'An on-time review that is only a signature does not do the job. Sensitive activity must be challenged.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-04 Firefighter”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts sessions reviewed on time, late, not reviewed, self-reviewed, and with activity that did not fit the reason.'],q:'Which file lets you check that the reviewer was allowed to review?',o:['The session log','The reviewer list','The control description'],a:1,e:'The reviewer list tells you who has the authority, and also shows when someone reviews their own session.'}],
 intro:'Ten emergency sessions with their reviews. The limit is five business days. For each row, mark Pass or Exception and choose the type.',
 cols:[['Reason given','reason'],['Activities','act'],['Reviewer','rev'],['Reviewed on','revOn'],['Business days','days'],['Independent?','ind']],

 {n:'FF-081 (H. Ito)',reason:'Fix job',act:'Restarted job',rev:'K. Wu',revOn:'15 Oct',days:'1',ind:'Yes',res:'Pass',why:'On time, independent, activity fits.'},

 outPrompt:'Six pass. The exceptions are one missing review, one self-review, one late review, and a printer fix that changed supplier bank details without challenge. Choose the outcome.',
 outs:[['Effective','Every session reviewed on time, independently, with fitting activity.'],['Effective, minor exceptions','A few reviews a day or two late, nothing unusual in the activity.'],['Not effective','Missing reviews, self-reviews or many late reviews.'],['Not effective, high risk','Sensitive activity unrelated to the reason, passed without challenge.']],outA:3,
 outWhy:'Sensitive activity (supplier bank details) unrelated to the reason, passed without challenge, is serious. The activity itself must be investigated.',
 fnd:[
 {k:'Condition (what you found)',o:['A session opened to fix a printer was used to change a supplier’s bank details, and the review did not question it; other sessions had missing, late or self reviews.','Emergency access is a weak area.','Some reviewers are lazy.'],a:0,e:'A condition states exactly what happened, not who is to blame.'},
 {k:'Criteria (the rule it breaks)',o:['Reviewers should read logs carefully.','Sessions must be reviewed within five business days by an independent person, and activity must match the stated reason.','Emergency access should be avoided.'],a:1,e:'The criteria is the company’s own rule: timing, independence and activity matching the reason.'},
 {k:'Cause (why it happened)',o:['The reviewer signs off sessions in bulk without reading the activity list.','People are busy.','The log is long.'],a:0,e:'A specific cause the company can fix. Confirm it with them before you write it.'},
 {k:'Effect (why it matters)',o:['The log files will grow.','A payment could have been redirected without being noticed.','Reviews take longer.'],a:1,e:'The effect is the business risk: money could have been redirected.'},
 {k:'Recommendation (what to do)',o:['Confirm the bank change was genuine and require reviewers to comment on each sensitive activity.','Stop all emergency access.','Review the sessions yearly instead.'],a:0,e:'Check the specific worrying activity, then fix how reviews are done.'}],
 model:'Emergency access gives support staff extra power for a short time, so someone must check afterwards what they did. I take every session and check it was reviewed within five business days, by someone independent, and that what was done matches the reason given. If all of that holds, the control works. A missing, late or self review is an exception, and sensitive activity nobody questioned is a serious finding.',
 points:['Emergency access gives extra power for a short time','Every session needs an independent review within five business days','Check the activity matches the reason','Unchallenged sensitive activity is serious'],
 quiz:[
 {q:'What is the population for AC-04?',o:['The review records','The session log','The reviewer list'],a:1,e:'The session log lists every emergency session, which is everything the control should cover.'},
 {q:'Who should review an emergency session?',o:['The person who used it','Someone independent of the user, and allowed to review','Any manager at all','The IT director only'],a:1,e:'People must not review their own sessions.'},
 {q:'FF-047 was opened to fix a printer, but the activity was changing vendor bank details. It was reviewed within two days with no comment. Result?',o:['Pass, as it was reviewed on time','Exception: the activity does not fit the reason','Exception: reviewed late','Not applicable'],a:1,e:'Timing was fine. The failure is that sensitive activity unrelated to the reason went unchallenged.'},
 {q:'D. Cole used a session on 3 September and also reviewed it himself. Result?',o:['Pass','Exception: reviewed by the user','Exception: reviewed late','Not applicable'],a:1,e:'The reviewer must be independent of the user.'},
 {q:'A review took exactly 5 business days. Everything else is correct. Result?',o:['Exception: late','Pass','Not applicable','Exception: no review'],a:1,e:'“Within five business days” includes the fifth day.'},
 {q:'A session has no review record at all. Result?',o:['Pass, if the activity looks harmless','Exception: not reviewed','Not applicable','Exception: self review'],a:1,e:'A session with no review means nobody checked the powerful activity.'},
 {q:'58 sessions. A printer-fix session was used to change supplier bank details, and the review, 11 days late, did not question it. Conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, high risk','Effective'],a:2,e:'Sensitive activity unrelated to the reason, passed without challenge, is the high-risk case.'},
 {q:'A few reviews were a day or two late, and nothing unusual appears in the activity. Likely conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, high risk','Effective, no exceptions'],a:0,e:'A few reviews slightly late with nothing unusual is reported as low risk.'}]
},

{id:'AC-05',title:'Managers reviewing who has access',folder:'AC-05 Access review',
 purpose:['Access builds up over time. People change jobs and keep old access. So at least once a year, managers are asked to look at a list of their team’s access and confirm it is still right, or ask for it to be removed. This is the <b>user access review</b>.','This test checks that the review covered everyone, that the right managers did it, and that the removals they asked for were actually made.'],
 qs:['Was the review list complete? If users were missing from the list, they were never reviewed.','Did the right manager review each user?','Was every line answered? Unanswered lines are not a review.','Were removals carried out? A manager asking for removal achieves nothing if IT never does it.'],
 files:[['1. Review listing','The list sent to managers: what was reviewed'],['2. User list at review date','Every account on the date the listing was made: proves the listing was complete'],['3. Review responses','Each manager’s decision per line: proof the review happened'],['4. Removal tickets and current access','Proof removals were made']],
 checks:[['1. On the review listing?','Exception: missing from listing'],['2. Reviewed by the right manager?','Exception: wrong reviewer'],['3. Was the line answered?','Exception: line not answered'],['4. Any removal actually done?','Exception: removal not done']],
 start:'Take one user from the user list',

 {t:'Stage 3: Testing',pts:['Pass means the user was on the listing, reviewed by their manager, answered, and any removal made.','Exceptions are users missing from the listing, wrong reviewers, unanswered lines and removals not done.'],q:'Every manager signed every line, but three users are missing from the listing. Result for those three?',o:['Pass, as the managers signed','Exception: never reviewed, because they were not on the listing','Not applicable'],a:1,e:'Testers who only check that managers signed miss incomplete listings and removals not made.'},

 checks:[['1. Covered by a mitigation?','Exception: conflict not covered'],['2. Current and owned?','Exception: expired or ownerless'],['3. Evidence that it ran?','Exception: no evidence it ran']],
 start:'Take one conflict from the report',
 walk:[

 {t:'Stage 2: Analysing the data',pts:['Match each user and conflict to the mitigation register.','Note the control, owner and expiry.','For the controls you sampled, check the evidence shows they ran in each period they should have.'],q:'Which three facts about each mitigating control do you note?',o:['Name, department and salary','The control, its owner and its expiry','Date raised, ticket and approver'],a:1,e:'A mitigation that is expired or has no owner does not count.'},
 {t:'Stage 3: Testing',pts:['Pass means the conflict is covered by a current, owned mitigation that ran.','Exceptions are uncovered conflicts, expired or ownerless mitigations, and mitigations with no evidence of running.'],q:'A mitigation is on the register with an owner and a valid expiry, but there are no signed reviews for 7 of 12 months. Result?',o:['Pass, as it is registered','Exception: no evidence it ran','Not applicable'],a:1,e:'A check on paper that nobody performs gives no protection.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-06 Segregation of duties”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts conflicts mitigated, not mitigated, expired and not evidenced.'],q:'What is a mitigating control?',o:['A role that removes the conflict','An extra check that watches over a risk that cannot be removed','A manager’s approval of a new role'],a:1,e:'It accepts the conflict but watches over it, for example a monthly review of payments made by the person who holds it.'}],

 {q:'The control is current, owned, and evidence shows it ran 12 of 12 months. Result?',o:['Exception','Pass','Not applicable','Ask for a sample'],a:1,e:'Covered, current, owned and evidenced is a pass.'},
 {q:'38 users with 61 conflicts. 58 covered, 3 not, including one user who can post and approve journals. Conclusion?',o:['Effective','Effective, minor exceptions','Not effective','Not effective, high risk'],a:3,e:'Uncovered conflicts in journals are the high-risk case.'},

{id:'AC-07',title:'Checking password settings match the policy',folder:'AC-07 Password settings',
 purpose:['The company’s security policy says how strong passwords must be: how long, how often they change, how many wrong attempts lock an account. The system has settings that enforce these rules.','If the settings are weaker than the policy, the policy is only words.','This test compares the system’s actual settings with the written policy.'],
 qs:['Does each setting meet the policy? For example, minimum length eight in policy and eight or more in the system.','Were the settings the same all year? A setting weakened for a few months is still a gap.','Are any users excused from the rules? Accounts excluded from password rules need a reason.'],
 files:[['1. Password policy','The company’s written rules: the yardstick'],['2. Settings report','The system’s current password settings'],['3. Settings change history','Any changes to the settings during the year'],['4. Accounts excused from password rules','Accounts set not to follow the normal rules']],
 checks:[['1. As strict as the policy?','Exception: weaker than policy'],['2. Not weakened at any time?','Exception: weakened part-year'],['3. Excused accounts have a reason?','Exception: excused, no reason']],
 start:'Take one policy rule',
 walk:[
 {t:'Stage 1: Getting ready',pts:['List each rule in the policy and find the matching setting in the report.','Confirm the change history covers the whole year.'],q:'The change history only covers the last six months. What do you do?',o:['Use it, as it is recent','Ask for the history for the whole year before concluding','Assume nothing changed earlier'],a:1,e:'You need to know the setting was met all year, so the history must cover all of it.'},
 {t:'Stage 2: Analysing the data',pts:['Place policy value and system value side by side for each rule.','Read the change history for any change to those settings.','List the excused accounts with the reason given.'],q:'A setting equals the policy today. Is that enough to pass it?',o:['Yes, today’s setting is what matters','No, read the change history, as a setting weakened for a few months is still a gap','Only if it is stricter than the policy'],a:1,e:'This is why the change history matters: settings are often relaxed during a project and put back later.'},
 {t:'Stage 3: Testing',pts:['A rule passes if the system value is at least as strict as the policy all year.','Exceptions are weaker settings, periods where settings were weakened, and excused accounts with no good reason.'],q:'The policy minimum length is 8 and the system enforces 10. Result?',o:['Exception, as it differs','Pass, as it is at least as strict as the policy','Not applicable'],a:1,e:'Stricter than policy still meets the policy.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-07 Password settings”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet lists each rule with Pass or Exception, and the number of excused accounts with and without a reason.'],q:'What must an excused account have?',o:['A reason that justifies the exemption','A manager’s password','A stricter policy'],a:0,e:'Accounts excluded from password rules need a reason, such as being a system account that cannot log in.'}],

{id:'AC-09',title:'Built-in accounts, debugging, direct table editing and system-to-system accounts',folder:'AC-09 Powerful abilities',

 qs:['Are the built-in accounts locked and their default passwords changed? A built-in account with its factory password is an open door.','Who can change values in a running program? In the live system this should be nobody, or a tiny approved group.','Who can edit data tables directly? Direct editing skips every business check.','Can any system-to-system account be used by a person to log in? These should only let systems talk to each other.'],
 files:[['1. Built-in accounts report','Each built-in account: locked or not, default password changed or not'],['2. Sensitive abilities list','Every user who can debug and change values, or edit tables: the population'],['3. System-to-system accounts list','Each such account, its type and what it can do'],['4. Approved list and policy','Who is allowed these abilities: the yardstick']],
 checks:[['1. Built-in account protected?','Exception: open or default pwd'],['2. Held only by approved staff?','Exception: unapproved holder'],['3. Cannot be used to log in?','Exception: person could log in']],
 start:'Take one item from the lists',

{id:'AC-10',title:'Checking that roles are built sensibly',folder:'AC-10 Role design',
 purpose:['People do not get access one task at a time. They get <b>roles</b>, bundles of tasks designed for a job, such as “Accounts Payable Clerk”.','If a role is badly designed, everyone who receives it gets the problem: too much access, or two conflicting tasks bundled together.','This test looks inside a set of roles to check they contain only what the job needs, have no built-in conflicts, and have an owner.'],
 qs:['Does the role contain only tasks that fit its name and purpose? An “AP Clerk” role that can post journals is badly designed.','Does any single role contain a conflict on its own? Create supplier and pay supplier in one role hands a conflict to every holder.','Does any role give unlimited reach, such as every company or every value, when the job needs only one?','Does each role have an owner who approves changes to it? Ownerless roles drift over time.'],
 files:[['1. Role list','Each role with its description and owner: the population'],['2. Role contents','Every task in each role, and its reach'],['3. Conflict pairs list','Pairs of tasks that must not be together'],['4. Role assignment counts','How many users hold each role']],
 checks:[['1. Tasks fit the role’s purpose?','Exception: out-of-place task'],['2. No conflict inside the role?','Exception: built-in conflict'],['3. Reach limited to the job?','Exception: unlimited reach'],['4. Has a named owner?','Exception: no owner']],
 start:'Take one sampled role',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Agree with your senior which roles to test, usually the ones used by finance and the ones held by the most users, for example 15 roles.','Note how you chose them.'],q:'Which roles do you usually choose to test?',o:['The newest roles','Roles used by finance and held by the most users','Roles with the longest names'],a:1,e:'A design problem in a widely held role spreads to the most people.'},
 {t:'Stage 2: Analysing the data',pts:['For each sampled role, read the tasks and compare them with the description.','Check every pair of tasks against the conflict pairs list.','Note any task whose reach is unlimited.','Note the owner and how many people hold the role.'],q:'A role contains both “create supplier” and “pay supplier”. What do you check it against?',o:['The role assignment counts','The conflict pairs list','The role list'],a:1,e:'Every pair of tasks in the role is checked against the conflict pairs list.'},
 {t:'Stage 3: Testing',pts:['Pass means the tasks fit the purpose, no built-in conflict, reach limited to what the job needs, and a named owner.','Exceptions are out-of-place tasks, built-in conflicts, unlimited reach, and missing owners.'],q:'A role has a couple of extra, harmless display tasks, and the owner is simply not recorded. What is the likely treatment?',o:['Not effective, high risk','Reported, low risk (minor exceptions)','Ignore completely'],a:1,e:'Harmless extras or a missing owner record are reported, with low risk.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AC-10 Role design”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet lists roles tested and how many had each kind of problem, weighted by the number of users affected.'],q:'Why weight the results by the number of users who hold each role?',o:['It makes the table look better','A design problem spreads to every holder, so a widely held role matters more','It is a company rule'],a:1,e:'A conflict in a role held by 12 users means 12 people inherit it.'}],

 {k:'Criteria (the rule it breaks)',o:['Roles should be small.','Roles must fit the job and contain no built-in conflicts.','Every role needs a long description.'],a:1,e:'The criteria is the company’s rule on role design.'},

 model:'People get access through roles, so a bad role affects everyone who holds it. I look inside the most-used roles to check they hold only what the job needs, contain no conflicting tasks, and have an owner. If so, the design is sound; a conflict inside a popular role is the most serious finding.',

 {q:'The GL Accountant role, held by 12 users, lets each post and approve their own journals. Conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, high risk','Effective'],a:2,e:'A built-in conflict in a widely held role is the high-risk case.'},
 {q:'One role has a few harmless extra display tasks, and an owner is not recorded. Everything else is sound. Likely conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, high risk','Effective, no exceptions'],a:0,e:'Harmless extras and a missing owner record are reported with low risk.'}]

{id:'AC-11',title:'Making sure powerful activity is recorded, including at the database',folder:'AC-11 Logging',
 purpose:['A system can keep a <b>security log</b>: a record of sensitive events such as failed log-ins, use of powerful accounts and changes to users.','Behind the system sits the database where the data is stored. People with direct database access can change data without using the system at all. Both need watching.','This test checks that the security log is switched on and records the right events, that it is kept long enough, and that direct database access is limited and itself logged.'],
 qs:['Is the security log switched on all year? A log that was off for a period leaves a blind spot.','Does it record the events the policy requires? Logging only failed log-ins misses the risky activity.','Is the log kept long enough and protected? A log overwritten after a week cannot support an investigation.','Who can reach the database directly, and is that logged? Direct access bypasses the system’s controls.'],
 files:[['1. Log settings report','Whether the log is on, which events, how long kept'],['2. Log settings history','Changes during the year: shows if logging was switched off or reduced'],['3. Database users list','Everyone with direct database access, and whether their actions are logged'],['4. Logging policy','What must be logged and kept, and who may access the database: the yardstick']],
 checks:[['1. Was the log on all year?','Exception: logging gap'],['2. Required events recorded?','Exception: events missing'],['3. Kept as long as the policy?','Exception: kept too briefly'],['4. DB users approved and logged?','Exception: unapproved or unlogged']],
 start:'Take one policy requirement',
 walk:[

 {t:'Stage 2: Analysing the data',pts:['Set each policy requirement beside the actual setting.','Read the history for any period the log was off or reduced.','For each database user, note who they are, what they can do, whether it is approved and whether their actions are logged.'],q:'The log is on today. Is that enough?',o:['Yes, it is on','No: read the history for any period it was off or reduced','Only if retention is 12 months'],a:1,e:'A log that was off for a period leaves a blind spot, even if it is on today.'},

{id:'AR-02',title:'When removal was late: every access route and any activity (Northbridge)',folder:'AR-02 Late removals',
 purpose:['When AR-01 finds that access was removed late, the job is not finished. You must find out whether the leaver could still reach the data by any route during the gap, and whether anyone actually did anything.','This decides whether the lateness was a paperwork problem or a real risk.'],
 qs:['Which routes did the leaver have during the gap? Their normal account, any second accounts, remote access, and any other system feeding the financial data.','Was there any log-in or activity in the gap? Including log-in attempts.','Was any data changed under their name? Changes during the gap are the clearest sign of risk.'],
 files:[['1. Late removals from AR-01','Each leaver removed late, with the gap dates: the population'],['2. Access routes list','Every account and remote access each leaver held'],['3. Activity log for the gap','Log-ins, attempts and actions per account'],['4. Change records','Changes to data made under those accounts in the gap']],
 checks:[['1. No data changed in the gap?','Risk realised'],['2. No log-in or viewing?','Activity without change'],['3. No failed attempts?','Attempts only']],
 flowEnd:'All Yes: No impact',
 start:'Take one late leaver from AR-01',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Take the exact gap dates for each late leaver from AR-01.','Confirm the activity log covers those dates and that logging was on (see AC-11).'],q:'The activity log does not cover part of a gap. What does that mean for your conclusion?',o:['Nothing, assume no activity','You cannot conclude “no impact” for that period until you have the log','The leaver is cleared'],a:1,e:'No log is not the same as no activity. The log must cover the gap and logging must have been on.'},
 {t:'Stage 2: Analysing the data',pts:['For each leaver, list every route and look for activity on each route in the gap.','Note every log-in, attempt and change, with date and time.'],q:'Which routes do you list for each leaver?',o:['Only the main account','The normal account, any second accounts, remote access, and other systems feeding the financial data','Only accounts with financial roles'],a:1,e:'Checking only the main account would miss the second account that was actually used.'},
 {t:'Stage 3: Testing',pts:['No activity on any route means the lateness is a control exception without impact.','Any activity is a realised risk: record exactly what happened and ask the company to explain and confirm whether the changes were legitimate.'],q:'The log shows log-ins and report viewing during the gap, but no changes. How is this classed?',o:['No impact','Attempts only','Activity without change: a realised risk of confidentiality'],a:2,e:'Reported as a realised risk of confidentiality. Only changes make it “risk realised”.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“AR-02 Late removals”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts late leavers with no activity and with activity, and lists each change made.'],q:'The company says a manager used the leaver’s account to finish work. Do you accept it without checking the changes?',o:['Yes, it sounds reasonable','No: the changes still have to be verified','Yes, if the manager is senior'],a:1,e:'It is usually a colleague finishing work, not misconduct, but a record was still changed by an unidentifiable person.'}],

 {q:'6 late removals: 5 with no activity, 1 with log-ins and a vendor change. What is the overall result?',o:['No impact','Attempts only','Activity without change','Risk realised, escalated'],a:3,e:'The worst result sets the outcome.'}]

 start:'Take one expected risk',

 purpose:['Programs and settings in the financial system change all year: fixes, improvements, new reports. Each change is moved from a development system into the live system.','If changes go in without approval or testing, a mistake or a deliberate fraud could change how financial figures are calculated. This test checks four things for every change you sample.'],
 qs:['Does every change moved into the live system have a ticket? A change without a ticket is an unexplained change.','Was it approved by the change board before it went live? Approval after go-live is not approval.','Did the business test and accept it before it went live? Users confirm the change does what it should.','Were writing and moving done by different people? One person doing both could put in anything.'],
 files:[['1. Live changes list','Every change moved into the live system in the year, with who wrote it, who moved it and when: the population'],['2. Change tickets','Ticket number, description, board approval date'],['3. Testing sign-offs','Business acceptance per change, with name and date'],['4. Control description','The change process and who may approve and move changes']],
 checks:[['1. Is there a ticket?','Exception: no ticket'],['2. Approved before go-live?','Exception: approved late'],['3. Accepted before go-live?','Exception: no acceptance'],['4. Writer differs from mover?','Exception: same person']],
 start:'Take one change from the live changes list',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Count the changes in the year and agree a sample, for example 25, with some from every quarter and any marked urgent.','Check the list comes from the live system’s own record of what arrived, not from the ticket tool.'],q:'Why must the list come from the live system and not from the ticket tool?',o:['It is easier to export','A change that arrived without a ticket would never appear in the ticket tool, so you could not see it','The ticket tool is always wrong'],a:1,e:'If you start from tickets, you only test changes that had a ticket. Starting from what actually arrived exposes the ones that did not.'},
 {t:'Stage 2: Analysing the data',pts:['Match each change to its ticket, the approval date and the test sign-off.','Put the go-live date beside each date.','Compare the writer with the mover.'],q:'Why put the go-live date beside the approval and acceptance dates?',o:['To check the dates are in the right format','Because approval or acceptance only counts if it came before go-live','To count the days in the year'],a:1,e:'A date means nothing until you compare it to go-live.'},
 {t:'Stage 3: Testing',pts:['Pass means a ticket, approval before go-live, acceptance before go-live, and a different writer and mover.','Exceptions are any missing element, any approval or acceptance after go-live, and the same person writing and moving.'],q:'A change was approved on 20 June and went live on 18 June. Result?',o:['Pass, as it has an approval','Exception: approved late','Not applicable'],a:1,e:'Approval after go-live is not approval.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“CM-01-03 Changes”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts changes tested, passes, and exceptions by type: no ticket, late approval, no acceptance, same writer and mover.'],q:'Which exception is the most serious?',o:['A sign-off dated the same day as go-live','A developer who wrote and moved their own change','A missing description'],a:1,e:'One person doing both could put in anything. Their changes must be checked.'}],
 intro:'Ten changes from the live changes list. For each, mark Pass or Exception and choose the type.',
 cols:[['Ticket','tkt'],['Approved','appr'],['Accepted','acc'],['Live on','live'],['Writer','wr'],['Mover','mv']],

 {n:'DEVK901377',tkt:'CHG 4588',appr:'20 Jun',acc:'none',live:'18 Jun',wr:'J. Kim',mv:'J. Kim',res:'Exception',type:'same',why:'The developer wrote and moved their own change. It also has no acceptance and late approval, but the same-person problem is the most serious.'},

 {n:'DEVK901480',tkt:'CHG 4633',appr:'3 Aug',acc:'4 Aug',live:'6 Aug',wr:'L. Chen',mv:'Basis team',res:'Pass',why:'All conditions met.'},

 {n:'DEVK901530',tkt:'CHG 4662',appr:'1 Sep',acc:'2 Sep',live:'4 Sep',wr:'A. Rao',mv:'Basis team',res:'Pass',why:'All conditions met.'},
 {n:'DEVK901562',tkt:'CHG 4690',appr:'15 Sep',acc:'16 Sep',live:'16 Sep',wr:'T. Reyes',mv:'Basis team',res:'Pass',why:'Acceptance on the day of go-live but clearly before it. The manual treats this as minor and low risk, not an exception.'},

 {q:'A change arrived in the live system with no ticket. Result?',o:['Pass','Exception: no ticket','Not applicable','Ask for a bigger sample'],a:1,e:'A change without a ticket is an unexplained change.'},
 {q:'Approved on 20 June, live on 18 June. Result?',o:['Pass','Exception: approved after go-live','Not applicable','Minor exception'],a:1,e:'Approval after go-live is not approval.'},
 {q:'The business accepted the change three days after go-live. Result?',o:['Pass','Exception: acceptance after go-live','Not applicable','Exception: no ticket'],a:1,e:'Users must confirm the change before it goes live.'},
 {q:'J. Kim wrote the change and J. Kim moved it. Result?',o:['Pass if everything else is fine','Exception: same writer and mover','Not applicable','Minor exception'],a:1,e:'One person doing both could put in anything.'},
 {q:'Acceptance is dated the same day as go-live, clearly before it. Everything else is fine. Result?',o:['Minor point: reported as low risk','Not effective','Not effective, high risk','Exception: no acceptance'],a:0,e:'The manual rates this as effective with minor exceptions.'},
 {q:'25 sampled: 22 pass, 3 exceptions including a developer who moved their own change. Conclusion?',o:['Effective, minor exceptions','Not effective, high risk','Effective','Not applicable'],a:1,e:'A developer moving their own change is the high-risk case, and their changes must be checked.'},
 {q:'What is the most common cause of a writer who also moves changes?',o:['Slow approvals','A developer who kept the ability to move changes after a project ended','Too many tickets','A lost approval'],a:1,e:'This is what usually happens.'}]
},

{id:'CM-04',title:'Keeping the live system locked against direct changes',folder:'CM-04 Client settings',
 purpose:['The live system has a master setting that says whether changes can be made directly in it, or only by moving tested changes in from development. It should stay locked all year.','If someone unlocks it, they can change programs and settings directly, skipping the whole change process. This test checks the setting was locked all year and, if it was ever opened, that the opening was approved, short and checked afterwards.'],
 qs:['Is the live system locked today? The current setting.','Was it ever opened during the year? From the setting’s change history.','If opened, was it approved, short and reviewed? And what was changed while it was open?'],
 files:[['1. Current settings report','Whether the live system allows direct changes now'],['2. Settings change history','Every time the setting was changed, by whom and when: shows any openings'],['3. Approval records','Approval for each opening'],['4. Changes made while open','What was changed during each opening']],
 checks:[['1. Was the opening approved?','Exception: not approved'],['2. Was it short?','Exception: open too long'],['3. Were its changes reviewed?','Exception: changes not reviewed']],
 start:'Take one opening from the settings history',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Confirm the history covers the whole year and was produced from the system itself.'],q:'The history you were given starts in March. What do you do?',o:['Test from March','Get a history for the whole year first, because an opening in January or February would be invisible','Assume the early months were locked'],a:1,e:'Missing months could hide the very opening you are looking for.'},
 {t:'Stage 2: Analysing the data',pts:['Read the history and list each opening with its start, end and the person.','Match each to an approval and to the changes made while it was open.'],q:'If the setting was locked all year, what is the result?',o:['Exception','Pass: nothing more to test','Not applicable, so you cannot conclude'],a:1,e:'Locked all year is the best outcome and needs no further checks.'},
 {t:'Stage 3: Testing',pts:['Pass means locked all year, or each opening approved, closed promptly, and the changes made during it reviewed.','Exceptions are unapproved or long openings, and openings with unreviewed changes.'],q:'An opening was approved and short, but nobody looked at what was changed during it. Result?',o:['Pass','Exception: changes not reviewed','Not applicable'],a:1,e:'The opening is only safe if someone checked what happened while it was open.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“CM-04 Client settings”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet states whether the system is locked now, the number of openings, and how many were approved and reviewed.'],q:'Why do you check the changes made during an opening, not just the opening?',o:['To make the file bigger','Because while it was open, changes bypassed testing and approval and could be anything','Because the history shows nothing else'],a:1,e:'The opening is the risk; the changes made during it are the effect.'}],
 intro:'Eight openings found in the year’s settings history. Assume the company’s rule is that an opening should close within 4 hours. Mark each Pass or Exception and choose the type.',
 cols:[['Opened','op'],['Closed','cl'],['By','by'],['Approved?','ap'],['Hours open','hr'],['Changes made','chg'],['Reviewed?','rv']],

 outPrompt:'Of eight openings, five pass and three are exceptions. One was a 56-hour opening with no approval and 14 unreviewed changes. Choose the outcome.',
 outs:[['Effective','Locked all year.'],['Effective, approved openings','Short, approved openings with changes reviewed. Acceptable.'],['Not effective','Openings without approval or review. A finding is raised.'],['Not effective, high risk','Long openings with changes to financial settings. Serious; the changes must be checked.']],outA:3,

 {k:'Criteria (the rule it breaks)',o:['Settings should be reviewed often.','The live system must stay locked except for approved, reviewed openings.','Consultants must not work in the live system.'],a:1,e:'The control’s own rule.'},

 {k:'Recommendation (what to do)',o:['Review the 14 changes, restrict who can change the setting, and alert on any opening.','Lock the system again and move on.','Ask consultants to ask first.'],a:0,e:'Check what happened, close the door, and watch it.'}],
 model:'The live system should be locked so changes can only come through the proper process. I check it was locked all year and, for any time it was opened, that the opening was approved and the changes made were reviewed. Locked or properly controlled means it works; unapproved openings are findings.',

 quiz:[
 {q:'What does the master setting control?',o:['Who can log in','Whether changes can be made directly in the live system','How reports look','Backup timing'],a:1,e:'Locked means changes only arrive through the change process.'},
 {q:'Which file shows whether the system was ever opened?',o:['Current settings report','Settings change history','Approval records','Changes made while open'],a:1,e:'The history lists every change to the setting.'},
 {q:'The system was locked all year. Result?',o:['Exception','Pass','Not applicable','Ask for more openings'],a:1,e:'Locked all year is the best outcome.'},
 {q:'An opening had no approval record. Result?',o:['Pass','Exception: not approved','Not applicable','Minor exception'],a:1,e:'Unapproved openings are exceptions.'},
 {q:'An opening was approved and short, but nobody reviewed the changes made during it. Result?',o:['Pass','Exception: changes not reviewed','Not applicable','Exception: not approved'],a:1,e:'What was changed during the opening must be reviewed.'},
 {q:'What usually causes an opening?',o:['Fraud','A short emergency fix','A scheduled upgrade','A failed backup'],a:1,e:'The usual problem is that nobody approved it or looked at what was changed.'},
 {q:'A 56-hour unapproved opening with 14 changes. Conclusion?',o:['Effective, approved openings','Not effective','Not effective, high risk','Effective'],a:2,e:'Long openings with changes are the serious case, and the changes must be checked.'},
 {q:'Two short, approved openings, with the changes reviewed. Conclusion?',o:['Effective, approved openings','Not effective','Not effective, high risk','Not applicable'],a:0,e:'Acceptable.'}]
},

{id:'CM-05',title:'Emergency changes approved within two business days',folder:'CM-05 Emergency changes',
 purpose:['Sometimes a fix cannot wait for the normal change board. The company allows emergency changes to go live first, as long as they are approved afterwards within two business days.','This test checks that every emergency change was genuinely urgent and approved in time.'],

 checks:[['1. Was it approved at all?','Exception: no approval'],['2. Within 2 business days?','Exception: approved late'],['3. Was it truly urgent?','Exception: not urgent']],
 start:'Take one emergency change',

 {t:'Stage 1: Getting ready',pts:['Count the emergency changes and compare the count with all changes. A high share of emergencies is itself a warning sign worth noting.'],q:'Emergency changes are 40% of all changes. What does that suggest?',o:['Nothing','The emergency route may be used to skip the board, which is worth noting','The company is very busy'],a:1,e:'A high share is a warning sign even before you test a single change.'},
 {t:'Stage 2: Analysing the data',pts:['For each change, note go-live, approval date and the business days between, the approver, and the reason.'],q:'Go-live was Friday and approval came on Monday. How many business days is that?',o:['3, counting the weekend','1, counting only business days','0'],a:1,e:'Count business days, not calendar days. Late approvals around weekends are common, and counting correctly matters.'},
 {t:'Stage 3: Testing',pts:['Pass means approved within two business days by an allowed approver, with a real urgent reason.','Exceptions are missing or late approvals and non-urgent reasons.'],q:'A change “to adjust a report layout” went live as an emergency and was approved the next day. Result?',o:['Pass, as it was approved in time','Exception: not urgent','Not applicable'],a:1,e:'The emergency route must not be used to avoid the board. A layout change can wait.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“CM-05 Emergency changes”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet counts emergency changes, on-time approvals, late or missing approvals, non-urgent ones, and emergencies as a share of all changes.'],q:'Which is the more telling problem?',o:['An approval a day late over a weekend','Ordinary changes labelled emergencies to skip the board','A missing approver title'],a:1,e:'Misuse of the route defeats the whole control.'}],

{id:'CH-01',title:'An emergency change authorised and reviewed (Northbridge)',folder:'CH-01 Emergency change',
 purpose:['At Northbridge this test follows <b>one real emergency change</b> in depth, as auditors often do when a significant event is flagged.','You trace it from the problem that caused it to its final review, checking every step happened and that what went live is what was approved.'],

 {q:'Repeated financial incidents with no root cause work. Conclusion?',o:['Effective','Not effective','Not effective, high risk','Effective, minor exceptions'],a:2,e:'The same failure keeps recurring and nobody looks at the cause.'},
 {q:'A few resolutions were slightly late. Everything else is clean. Likely conclusion?',o:['Effective, minor exceptions','Not effective','Not effective, high risk','Effective, no exceptions'],a:0,e:'Reported, low risk.'}]
