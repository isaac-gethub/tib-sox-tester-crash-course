{id:'P4-01',title:'Proving the list of all users is complete',folder:'P4-01 User population',
 purpose:['Almost every access test starts from the list of all user accounts. If that list is missing accounts, every test built on it misses them too.','This is <b>not a control test</b>. You prove the list is complete (nothing left out) and accurate (the details are right) before relying on it, by comparing it with independent figures.'],
 qs:['Does the number of rows match the system’s own count? The count is taken separately, for example a screenshot of the total.','Were any filters applied that cut accounts out? The extraction notes should show none, or only agreed ones.','Are the details accurate? A few accounts are compared field by field with independent screenshots.'],
 files:[['1. User list','Every account with type, status and dates: the list to be proved'],['2. Count evidence','An independent total of accounts, with date and time: proves nothing is missing'],['3. Extraction notes','How and when the list was produced, and any filters: spots anything excluded'],['4. Sample screenshots','Details of a few accounts captured separately: proves the details are right']],
 checks:[['1. Does the count match the total?','Exception: count differs'],['2. Any filters removing accounts?','Exception: filter used'],['3. Sample agrees to screenshots?','Exception: detail differs']],
 flowEnd:'All Yes: list is reliable',
 start:'Take the user list, the count and the screenshots',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Check the list, count and screenshots were all taken on the same date and from the live system.','Write down the three things you will compare: the list itself, the independent total, and the screenshots. If one is missing, ask for it now.','Note who produced the list and when.'],q:'The count evidence is dated a week after the list. What do you do?',o:['Use it anyway','Ask for a count taken on the same date, because accounts change and the two cannot be compared','Ignore the count'],a:1,e:'The list and the count must be taken on the same date from the live system.'},
 {t:'Stage 2: Analysing the data',pts:['Count the rows, removing the header row, blank rows at the bottom and any total lines added by whoever produced the file.','Compare with the independent total and read the extraction notes for filters.','Pick a mix of accounts for the screenshots: one ordinary person, one locked, one technical, and one created late in the year.'],q:'Why choose a mix of accounts for the screenshot sample?',o:['It looks tidy','A mix catches more problems than five similar accounts','It is the company’s rule'],a:1,e:'A locked account, for example, is exactly the type a hidden filter removes.'},
 {t:'Stage 3: Testing',pts:['Complete if the counts agree and no filters removed accounts. Accurate if the sampled fields agree.','If the counts differ, do not explain the difference yourself. Write down both numbers and ask whoever produced the list.','Record your decision: “Reliable for use in AC-01 to AC-08”, or “Not reliable, re-extraction requested on [date]”.'],q:'The count is 640 in the list and 652 on the independent total. What do you do?',o:['Assume the 12 are test accounts','Record both numbers and ask the person who produced the list','Add 12 rows yourself'],a:1,e:'The usual answers are a filter, a different date, or a report that skips a type of account. Do not guess.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“P4-01 User population”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','There is no separate Summary sheet; the conclusion line at the bottom of the working table says whether the list can be relied on.'],q:'What is the most common problem found?',o:['Duplicate rows','A hidden filter, often “active users only”','Misspelled names'],a:1,e:'It is much cheaper to find it here than after every test is finished.'}],
 intro:'Ten checks on a user list dated 31 December. Mark each Pass or Exception and choose the type. The list has 643 rows including a header, a blank row and a total line.',
 cols:[['Expected','exp'],['Found','fnd']],
 types:{count:'Row count differs',filter:'Filter removed accounts',absent:'Sampled account missing from list',detail:'Detail disagrees with screenshot'},
 rows:[
 {n:'Same date, live system',exp:'All three from 31 Dec',fnd:'All from 31 Dec, live',res:'Pass',why:'The list, count and screenshots can be compared.'},
 {n:'Row count vs system total',exp:'640',fnd:'640 (after removing header, blank and total lines)',res:'Pass',why:'Counts agree once the three extra lines are removed. But a matching count alone does not prove completeness: see the filter below.'},
 {n:'Filters applied',exp:'None',fnd:'Status = active only',res:'Exception',type:'filter',why:'A saved “active users only” filter was used. The count agrees because the independent total was taken with the same filter, so the count alone could not show it. The extraction notes did.'},
 {n:'Broken or damaged rows',exp:'None',fnd:'None',res:'Pass',why:'No names in date columns or other signs of damage.'},
 {n:'Sample: KADEYEMI (ordinary)',exp:'Type Dialog',fnd:'Type Dialog',res:'Pass',why:'Agrees to the screenshot.'},
 {n:'Sample: BATCH_FI (technical)',exp:'Status Active',fnd:'Status Active',res:'Pass',why:'Agrees to the screenshot.'},
 {n:'Sample: J. DOE (locked)',exp:'Present, status Locked',fnd:'Not in the list',res:'Exception',type:'absent',why:'A locked account on the screenshot is missing from the list. This is what exposes the filter, and it matters because locked accounts include leavers.'},
 {n:'Sample: N. OKAFOR (created 12 Nov)',exp:'Created 12 Nov',fnd:'Created 12 Nov',res:'Pass',why:'Agrees to the screenshot.'},
 {n:'Sample: R. MENSAH (ordinary)',exp:'Type Dialog',fnd:'Type Dialog',res:'Pass',why:'Agrees to the screenshot.'},
 {n:'Who produced it, and when',exp:'Named, dated',fnd:'IT Operations, 2 Jan',res:'Pass',why:'The working paper can say who produced the list and when.'}],
 outPrompt:'Eight checks pass, but the list excludes locked accounts. Decide whether the list can be relied on.',
 outs:[['Reliable','Counts agree, no filters, sample details agree. The list can be used.'],['Reliable after correction','A difference explained and corrected by a new extraction. Use the corrected list.'],['Not reliable','Counts differ or filters removed records, unresolved. Tests depending on it cannot conclude.'],['Not reliable, widespread','The same faulty list used across several tests. All those tests must be redone.']],outA:2,
 outWhy:'A filter removed accounts and the issue is not yet resolved, so the list is not reliable until it is re-extracted. If the faulty list had already been used across several tests, it would be “widespread”.',
 fnd:[
 {k:'Condition (what you found)',o:['The user list is not good enough.','The user list provided excluded locked accounts.','Some accounts are missing.'],a:1,e:'State exactly what was excluded.'},
 {k:'Criteria (the rule it breaks)',o:['Lists used for testing must be complete.','Lists should be accurate.','Accounts must not be locked.'],a:0,e:'The standard for information used as a starting point.'},
 {k:'Cause (why it happened)',o:['The extraction used a saved filter for active users.','Someone deleted accounts.','The system lost data.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['Tests built on this list would miss locked accounts, including leavers.','The list is shorter.','The file is smaller.'],a:0,e:'Leavers are often locked, so they would never be tested.'},
 {k:'Recommendation (what to do)',o:['Re-extract without the filter and retest affected procedures.','Ignore locked accounts.','Add accounts by hand.'],a:0,e:'Fix the list, then redo what depended on it.'}],
 model:'Most tests start from the list of all users, so I first prove that list is complete and correct. I compare its row count with an independent total, check no filters were used, and agree a few accounts to separate screenshots. If it all agrees, the list can be relied on; otherwise it must be redone before testing.',
 points:['Prove the list before any test relies on it','Compare the row count with an independent total','Read the extraction notes for filters','Agree a mix of accounts to screenshots'],
 quiz:[
 {q:'Is P4-01 a control test?',o:['Yes','No: it proves a list before it is used','Only for locked accounts'],a:1,e:'It decides whether a list can be relied on, not whether a control worked.'},
 {q:'Which three things do you compare?',o:['The list, an independent total, and screenshots','Three user lists','The list and two policies'],a:0,e:'If any is missing, ask for it before starting.'},
 {q:'The file has 643 rows including a header, a blank row and a total line. How many accounts?',o:['643','640','641','646'],a:1,e:'Remove the header, the blank row and the total line.'},
 {q:'The count agrees but the extraction notes say “active only”. Result?',o:['Pass, as the counts agree','Exception: filter removed accounts','Not applicable'],a:1,e:'The independent count may have been taken with the same filter.'},
 {q:'The list shows 640 accounts and the independent total shows 652. What do you do?',o:['Explain the gap yourself','Record both numbers and ask the person who produced the list','Pass it'],a:1,e:'Usual causes: a filter, a different date, or a skipped account type.'},
 {q:'Which account type is most likely to be removed by a hidden filter?',o:['Active dialog users','Locked accounts','Newly created accounts'],a:1,e:'The most common problem is an “active users only” filter.'},
 {q:'A filter removed locked accounts; nothing has been resolved yet. Outcome?',o:['Reliable','Reliable after correction','Not reliable','Not reliable, widespread'],a:2,e:'Not reliable until re-extracted.'},
 {q:'The same faulty list had already been used in several tests. Outcome?',o:['Reliable after correction','Not reliable','Not reliable, widespread','Reliable'],a:2,e:'All those tests must be redone.'}]
},

{id:'P4-02',title:'Proving the list of who holds which role is complete',folder:'P4-02 Role assignments',
 purpose:['Access tests look at which roles each person holds, and that comes from a role assignment list. Like the user list, it must be proved complete and accurate before use.','The list has a particular trap: assignments that are <b>temporary or expire</b>, and roles received indirectly through groups or bundles.'],
 qs:['Does the row count match an independent total? Proves nothing is missing.','Are temporary and expired assignments treated correctly? Assignments with end dates must be handled as agreed.','Do sampled users’ roles agree to screenshots? Proves accuracy.'],
 files:[['1. Role assignment list','User, role, start and end date: the list to prove'],['2. Count evidence','Independent total of assignments: completeness'],['3. Extraction notes','Date and filters: to spot exclusions'],['4. Sample screenshots','Roles of a few users captured separately: accuracy']],
 checks:[['1. Does the count match?','Exception: count differs'],['2. End dates handled as agreed?','Exception: end dates mishandled'],['3. Group roles included?','Exception: group roles missing'],['4. Sample roles agree?','Exception: roles differ']],
 flowEnd:'All Yes: list is reliable',
 start:'Take the role assignment list',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Confirm the date and that the list includes end dates.','Ask how the company gives roles: directly to each person, or through groups or bundles of roles.','If groups or bundles are used, the list must show those roles too, and the extraction notes should say so.'],q:'The company gives most roles through groups. What must you check?',o:['Nothing extra','The list includes roles received through groups, and the extraction notes say so','Only the group names'],a:1,e:'A simple extraction often reads only direct assignments.'},
 {t:'Stage 2: Analysing the data',pts:['Compare counts, check filters, check how past end dates are shown, and agree sampled users’ roles to screenshots.','Sort by user, then role, so each person’s roles sit together.','Decide with your senior whether assignments that ended during the year should be in the list.'],q:'For a year-end access test, should assignments that ended mid-year be in the list?',o:['Yes, always','Usually not; for a test across the year, usually yes: agree it with your senior','Never'],a:1,e:'It depends on what the test is about. Agree the treatment first.'},
 {t:'Stage 3: Testing',pts:['Reliable if counts agree, end dates are handled as agreed and samples agree.','Compare each sampled person’s roles one by one, ticking each role found.','A role on the screenshot but not in the list means the list is incomplete. Ask about every difference.'],q:'A screenshot shows 6 roles and the list shows 5 for the same person. What does that suggest?',o:['The screenshot is wrong','The list is incomplete: a role is missing','Nothing'],a:1,e:'A role on the screenshot but not in the list means the list is incomplete.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“P4-02 Role assignments”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The conclusion line states whether the list can be relied on.'],q:'What is the most common gap?',o:['Duplicate roles','Roles received indirectly, for example through groups or composite roles','Misspelled role names'],a:1,e:'A simple extraction leaves them out.'}],
 intro:'Ten checks on a role assignment list of 3,912 assignments at 31 December. Mark each Pass or Exception and choose the type. Agreed with your senior: assignments that ended before year end are excluded.',
 cols:[['Expected','exp'],['Found','fnd']],
 types:{count:'Row count differs',end:'End dates mishandled',indirect:'Roles from groups missing',detail:'Roles differ from screenshot'},
 rows:[
 {n:'Date and end dates present',exp:'31 Dec, end dates shown',fnd:'31 Dec, end dates shown',res:'Pass',why:'The list can be tested.'},
 {n:'Row count vs total',exp:'3,912',fnd:'3,912',res:'Pass',why:'Counts agree.'},
 {n:'Expired assignments',exp:'Excluded, as agreed',fnd:'Excluded',res:'Pass',why:'Handled as agreed.'},
 {n:'Roles through groups included',exp:'Yes, per extraction notes',fnd:'Direct assignments only',res:'Exception',type:'indirect',why:'The extraction read direct assignments only. Access tests could miss roles, including conflicts.'},
 {n:'Sample: R. Moss',exp:'4 roles',fnd:'4 roles',res:'Pass',why:'All four roles agree.'},
 {n:'Sample: Y. Tan',exp:'6 roles',fnd:'5 roles',res:'Exception',type:'detail',why:'The sixth role, received through a group, is on the screenshot but not in the list. The list is incomplete.'},
 {n:'Sample: A. Ruiz (many roles)',exp:'11 roles',fnd:'11 roles',res:'Pass',why:'A person with many roles still agrees.'},
 {n:'Sample: T. Bello (direct roles only)',exp:'3 roles',fnd:'3 roles',res:'Pass',why:'Direct roles agree. It is the group-based roles that are missing.'},
 {n:'Sample: assignment ended 30 June',exp:'Not in the list',fnd:'Not in the list',res:'Pass',why:'Expired assignments are excluded, as agreed.'},
 {n:'Duplicate rows',exp:'None',fnd:'None',res:'Pass',why:'No duplicates found after sorting by user and role.'}],
 outPrompt:'Eight checks pass, but roles received through groups are not in the list. Decide whether the list can be relied on.',
 outs:[['Reliable','All checks agree. Use the list.'],['Reliable after correction','A gap found and fixed by a new extraction. Use the corrected list.'],['Not reliable','Unexplained differences. Dependent tests cannot conclude.'],['Not reliable, widespread','Used across many tests. Redo them.']],outA:2,
 outWhy:'The gap is real and not yet fixed, so the list is not reliable until it is re-extracted with group-based roles. Once re-extracted and agreed, it would be “reliable after correction”.',
 fnd:[
 {k:'Condition (what you found)',o:['Roles are missing.','Roles received through user groups were missing from the assignment list.','The list is wrong.'],a:1,e:'State exactly which roles were missing.'},
 {k:'Criteria (the rule it breaks)',o:['Lists used for testing must include all assignments.','Roles should be reviewed.','Groups must be documented.'],a:0,e:'The standard for information used as a starting point.'},
 {k:'Cause (why it happened)',o:['The extraction read direct assignments only.','Someone removed roles.','The system is slow.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['Access tests could miss roles, including conflicts.','The list is incomplete.','The file is smaller.'],a:0,e:'Missing roles could hide conflicts.'},
 {k:'Recommendation (what to do)',o:['Re-extract including group-based roles.','Ignore group roles.','Add roles by hand.'],a:0,e:'Fix the extraction, then rely on the list.'}],
 model:'Access tests rely on the list of who holds which role. I prove it is complete by comparing its count with an independent total and checking a few users’ roles against screenshots. If it agrees it can be relied on; missing indirect roles are the usual problem.',
 points:['Compare the count with an independent total','Agree how ended assignments are treated','Make sure roles received through groups are included','Agree sampled users’ roles to screenshots, one by one'],
 quiz:[
 {q:'Why must the list show roles received through groups?',o:['It is tidier','People hold those roles too, and access tests would miss them','Groups are always large'],a:1,e:'A simple extraction often leaves them out.'},
 {q:'A person’s screenshot shows 6 roles; the list shows 5. What does it suggest?',o:['The screenshot is wrong','The list is incomplete','Nothing'],a:1,e:'A role on the screenshot but not in the list means the list is incomplete.'},
 {q:'A role is in the list but not on the screenshot. What might it mean?',o:['Nothing','It ended, or the list is wrong: ask','Pass'],a:1,e:'Ask about every difference.'},
 {q:'For a year-end access test, should assignments that ended mid-year be included?',o:['Always','Usually not: agree with your senior','Never'],a:1,e:'It depends on the test. Agree the treatment first.'},
 {q:'Who decides how end dates are treated?',o:['You, alone','You agree it with your senior before testing','The company'],a:1,e:'It must be agreed before you test.'},
 {q:'Why sort the list by user, then role?',o:['It looks nicer','Each person’s roles sit together, making comparison with the screenshot easy','It removes duplicates'],a:1,e:'It makes the one-by-one comparison simple.'},
 {q:'Roles through groups are missing and not yet fixed. Outcome?',o:['Reliable','Reliable after correction','Not reliable','Not reliable, widespread'],a:2,e:'Not reliable until re-extracted.'},
 {q:'A difference was found and fixed by a new extraction, and the new list agrees. Outcome?',o:['Reliable','Reliable after correction','Not reliable','Not reliable, widespread'],a:1,e:'Use the corrected list.'}]
},

{id:'P4-03',title:'Proving the HR leavers list is complete',folder:'P4-03 Leavers population',
 purpose:['The leavers test (AC-02) relies on HR’s list of people who left. HR runs that report, not IT, so you must prove it includes <b>everyone</b> who left in the year.','This is not a control test. It proves a list before AC-02 relies on it, and its outcomes are reliable or not reliable.'],
 qs:['Does the list cover the whole year? Earliest and latest dates.','Does its count agree with an independent HR figure? For example headcount movements or payroll leavers.','Are all kinds of leaver included? Contractors, transfers and retirements, not only resignations.'],
 files:[['1. Leavers list','Leavers with dates and type: the list to prove'],['2. HR headcount movement','Starting headcount, joiners, leavers, ending headcount: the independent total'],['3. Report parameters','Dates and leaver types selected: to spot exclusions'],['4. Sample HR records','A few leavers’ files: accuracy of dates']],
 checks:[['1. Whole year covered?','Exception: dates incomplete'],['2. Count agrees with HR figure?','Exception: count differs'],['3. All leaver types included?','Exception: leaver type left out'],['4. Sample dates agree?','Exception: date differs']],
 flowEnd:'All Yes: list is reliable',
 start:'Take the leavers list and the HR headcount movement',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Confirm who ran the report and when.','Find out from HR which dates and which kinds of leaver were selected.','Ask what kinds of worker exist (employees, contractors, temporary staff, transfers) and whether any can have access to the financial system. Every kind that can have access must be in the list.'],q:'Contractors can log in to the financial system. Must they be in the leavers list?',o:['No, only employees leave','Yes: every kind of worker who can have access must be in the list','Only if they were paid'],a:1,e:'The population must include everyone with system access.'},
 {t:'Stage 2: Analysing the data',pts:['Check the date range and compare the count with the headcount movement.','The movement is simple arithmetic: people at the start, plus joiners, minus leavers, equals people at the end. Take the leavers figure and compare it with the rows in the list.','Sort by date and look at the spread: months with no leavers, or a sudden drop, can mean part of the year is missing.'],q:'The list has no leavers at all in October and November. What does it suggest?',o:['A quiet period','Part of the year may be missing, so ask HR','Nothing'],a:1,e:'A gap in the spread is a sign the report did not cover the whole year.'},
 {t:'Stage 3: Testing',pts:['Reliable if the full year is covered, counts agree, all types are included and dates agree.','If the counts differ, ask HR to name the people who make up the difference. Usually they are one kind of worker left out.','The list must be rerun or the missing people added, and AC-02 must use the corrected list.'],q:'The leavers list has 63 rows; HR’s movement says 71 left. What do you do?',o:['Use the list; 63 is close','Ask HR to name the 8 people who make up the difference','Add 8 names yourself'],a:1,e:'Do not guess. The difference is usually one kind of worker left out.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“P4-03 Leavers population”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The conclusion line states whether the list can be relied on; any difference is explained in the working paper.'],q:'Which group is most often missing from HR lists?',o:['Managers','Contractors and temporary staff','Retirees'],a:1,e:'HR lists are usually complete for employees.'}],
 intro:'Ten checks on the HR leavers list for the year. Mark each Pass or Exception and choose the type.',
 cols:[['Expected','exp'],['Found','fnd']],
 types:{range:'Dates incomplete',count:'Count differs',types:'Leaver type left out',date:'Leaving date disagrees with HR file'},
 rows:[
 {n:'Who ran it, and when',exp:'Named, dated',fnd:'HR, 3 Jan',res:'Pass',why:'The working paper can say who produced the list and when.'},
 {n:'Date range',exp:'1 Jan to 31 Dec',fnd:'1 Jan to 31 Dec',res:'Pass',why:'The whole year is covered.'},
 {n:'Headcount arithmetic',exp:'1,180 + 94 joiners − 71 leavers = 1,203',fnd:'Ending headcount 1,203',res:'Pass',why:'The HR figures add up, so 71 can be used as the independent total.'},
 {n:'Count vs headcount movement',exp:'71',fnd:'63',res:'Exception',type:'count',why:'Eight people who left are not in the list. The difference must be named by HR, not guessed.'},
 {n:'Leaver types selected',exp:'All kinds',fnd:'Employees only',res:'Exception',type:'types',why:'Contractors are held in a separate HR category and were not selected. This explains the 8 missing people.'},
 {n:'Spread by month',exp:'Leavers in every month',fnd:'Leavers in every month',res:'Pass',why:'No gaps that suggest a missing period.'},
 {n:'Sample: employee leaving date',exp:'Agrees to HR file',fnd:'Agrees',res:'Pass',why:'Date agrees.'},
 {n:'Sample: retirement',exp:'Agrees to HR file',fnd:'Agrees',res:'Pass',why:'Date agrees.'},
 {n:'Sample: transfer out',exp:'Agrees to HR file',fnd:'Agrees',res:'Pass',why:'Date agrees.'},
 {n:'Sample: resignation',exp:'Agrees to HR file',fnd:'Agrees',res:'Pass',why:'Date agrees.'}],
 outPrompt:'Eight checks pass or are explained, but eight contractors with system access are missing from the leavers list. Decide whether the list can be relied on.',
 outs:[['Reliable','Full year, counts agree, all types. Use in AC-02.'],['Reliable after correction','Missing types added. Use the corrected list.'],['Not reliable','Count difference unexplained. AC-02 cannot conclude.'],['Not reliable, high risk','Contractors with access missing. Serious gap in leaver testing.']],outA:3,
 outWhy:'Contractors with system access are missing, so contractor accounts would escape the leavers test entirely. That is the high-risk case. The manual’s example conclusion says “Not reliable until contractors included”; the outcomes table gives the high-risk label.',
 fnd:[
 {k:'Condition (what you found)',o:['The HR list is incomplete.','The HR leavers list omitted eight contractors.','Some people are missing.'],a:1,e:'Say how many, and which kind of worker.'},
 {k:'Criteria (the rule it breaks)',o:['The leavers population must include everyone with system access.','Leavers must be reported monthly.','HR must keep records.'],a:0,e:'The standard for the population.'},
 {k:'Cause (why it happened)',o:['Contractors are held in a separate HR category.','HR is careless.','The report is old.'],a:0,e:'A specific, fixable cause.'},
 {k:'Effect (why it matters)',o:['Contractor accounts would escape the leavers test.','The count is lower.','The list is shorter.'],a:0,e:'Accounts that should have been locked would never be checked.'},
 {k:'Recommendation (what to do)',o:['Rerun including contractors and retest AC-02.','Ignore contractors.','Ask HR to be careful.'],a:0,e:'Fix the list, then redo what depended on it.'}],
 model:'The leavers test only works if HR’s list includes everyone who left. I check it covers the whole year, agrees with HR’s own headcount figures and includes every kind of leaver. Missing contractors is the usual problem.',
 points:['The leavers test needs a complete HR list','Check the whole year is covered','Compare the count with HR’s headcount movement','Make sure every kind of leaver is included, especially contractors'],
 quiz:[
 {q:'Who produces the leavers list?',o:['IT','HR','The auditor'],a:1,e:'HR runs the report, so you must prove it.'},
 {q:'Opening 1,180, joiners 94, leavers 71. What is the ending headcount?',o:['1,203','1,251','1,109','1,180'],a:0,e:'1,180 + 94 − 71 = 1,203.'},
 {q:'No leavers in two consecutive months. What does it suggest?',o:['Nothing','Part of the year may be missing','A good year'],a:1,e:'A gap in the spread is a warning sign.'},
 {q:'The list has 63 rows against 71 leavers. What do you do?',o:['Accept it','Ask HR to name the people who make up the difference','Add names yourself'],a:1,e:'Do not guess.'},
 {q:'The report parameters show “Employees only”. Result?',o:['Pass','Exception: leaver type left out','Not applicable'],a:1,e:'Every kind that can have access must be included.'},
 {q:'Which group is most often missing?',o:['Contractors and temporary staff','Managers','Interns only'],a:0,e:'HR lists are usually complete for employees.'},
 {q:'Contractors with access are missing from the list. Outcome?',o:['Reliable','Reliable after correction','Not reliable','Not reliable, high risk'],a:3,e:'A serious gap in leaver testing.'},
 {q:'The missing types were added and the list agrees to the headcount. Outcome?',o:['Reliable','Reliable after correction','Not reliable','Not reliable, high risk'],a:1,e:'Use the corrected list.'}]
},

{id:'P4-04',title:'Matching new users to access tickets',folder:'P4-04 New users',
 purpose:['The provisioning test (AC-01) starts from the list of new access. This procedure proves that list is complete by approaching it from the other side: every account created <b>in the system</b> in the year should appear, whether or not it has a ticket.','Accounts found in the system but missing from the ticket list are exactly what the control is meant to catch.'],
 qs:['Does the count of accounts created in the year agree with an independent total? Completeness of the system list.','Does every created account appear in the population used for AC-01? So none is hidden.','Which created accounts have no ticket at all? These go straight to AC-01 as exceptions.'],
 files:[['1. Accounts created in the year','From the system, with creation date and creator: the independent side'],['2. Ticket list','Access tickets in the year: the process side'],['3. Count evidence','Independent total of accounts created: completeness'],['4. AC-01 population','The new access list used in AC-01: to check nothing is missing']],
 checks:[['1. Count agrees with the total?','Exception: count differs'],['2. Account has a ticket?','Exception: created, no ticket'],['3. In the AC-01 population?','Exception: missing from AC-01']],
 flowEnd:'All Yes: population complete',
 start:'Take each account created in the system',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Confirm both lists cover the same dates.','Make sure the list of accounts created comes from the system itself, not from the ticket tool.'],q:'Why must the created accounts list come from the system?',o:['It is faster','Starting from what actually happened makes accounts created without a ticket show up','Tickets are unreliable'],a:1,e:'A list built from tickets hides exactly the accounts created without one.'},

{id:'P4-05',title:'Proving the access review listing was complete',folder:'P4-05 Review listing',

 checks:[['1. Both lists same date?','Exception: different dates'],['2. Count agrees?','Exception: count differs'],['3. Every item in the listing?','Exception: missing from listing']],
 flowEnd:'All Yes: listing is reliable',
 start:'Take the review listing and the full list',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Check both lists have the same date.','Find out the exact date and time the review listing was produced, and ask for a full list from the same date.'],q:'The full list is from a week after the review listing. What do you do?',o:['Compare anyway','Ask for a full list from the same date: lists from different dates never agree','Ignore the date'],a:1,e:'You would waste time chasing differences that are only timing.'},
 {t:'Stage 2: Analysing the data',pts:['Match the two lists line by line, using user and role together.','Put the results in three groups: in both lists, only in the full list, and only in the review listing.','For each item only in the full list, check whether it is on the agreed exclusions list.'],q:'Which group is the important one?',o:['In both lists','Only in the full list: users or roles never put in front of a manager','Only in the review listing'],a:1,e:'Their access was never reviewed.'},
 {t:'Stage 3: Testing',pts:['Reliable if every user and role appears or is an agreed exclusion.','Every missing item that is not an agreed exclusion is an exception. Count them and note who they are, especially anyone with sensitive access.','These exceptions feed directly into your AC-05 conclusion.'],q:'A technical account is missing from the listing but is on the agreed exclusions list. Result?',o:['Exception','Pass: agreed exclusion','Not applicable'],a:1,e:'Exclusions that are agreed and justified are acceptable.'},

{id:'P-01',title:'Proving the termination list is complete (Northbridge)',folder:'P-01 Termination population',
 purpose:['Northbridge’s removal tests (AR-01 and AR-02) start from the termination list. This procedure proves that list is complete by checking it against <b>two independent sources</b>: payroll leavers and the removal tickets.','This is not a control test. Its outcomes are reliable or not reliable.'],
 qs:['Does every payroll leaver appear? Payroll is independent of HR.','Does every removal ticket relate to someone on the list? Tickets for people missing from the list reveal gaps.','Does the list cover the whole year? Dates.'],
 files:[['1. Termination list','From HR: the list to prove'],['2. Payroll leavers','People removed from payroll: independent source'],['3. Removal tickets','Tickets raised for leavers: second independent source'],['4. Report parameters','Dates and filters: exclusions']],
 checks:[['1. Payroll leavers on the list?','Exception: missing from list'],['2. Ticketed people on the list?','Exception: ticket, not on list'],['3. Whole year covered?','Exception: dates incomplete']],
 flowEnd:'All Yes: list is reliable',
 start:'Take the HR list, payroll leavers and tickets',
 walk:[
 {t:'Stage 1: Getting ready',pts:['Line up the three sources so they cover exactly the same dates.','Ask how each is produced: HR records the decision to leave, payroll records when pay stopped, and tickets record when IT was asked to act.','Dates can differ by a few days between them, and that is normal.'],q:'The leaver’s HR date is 28 Feb, payroll stops 3 Mar, and the ticket is 1 Mar. What do you conclude?',o:['A problem','Normal: the three sources record different events a few days apart','Fraud'],a:1,e:'The sources measure different things, so small date differences are expected.'},
 {t:'Stage 2: Analysing the data',pts:['Three-way match: list to payroll, list to tickets, tickets to list.','Use the employee number to match where you can; names are spelled differently in different systems.','Build one table with a row for every person found in any source and whether they appear in each. People found in payroll or tickets but not on the HR list are the ones that matter.'],q:'Why match on employee number and not name?',o:['It is shorter','Names are spelled differently in different systems','Names are confidential'],a:1,e:'Matching on names produces false differences.'},
 {t:'Stage 3: Testing',pts:['Reliable if every payroll leaver and every ticketed person is on the list, or explained.','Ask HR to explain each person missing from their list.','A person who genuinely left must be added and tested in AR-01. Someone who did not leave, for example a payroll correction, can be removed with the explanation saved as evidence.'],q:'A person is on payroll leavers but not on the HR list. HR says it was a payroll correction and the person did not leave. What do you do?',o:['Add them to the list','Remove them from consideration and save the explanation as evidence','Raise a finding'],a:1,e:'They did not leave, so they are not part of the population.'},
 {t:'Stage 4: Evidence and deliverables',pts:['The evidence folder (“P-01 Termination population”) holds the 4 files you were given, unchanged, plus company explanations saved as PDF.','The Summary sheet shows counts from each source and the differences.'],q:'Which group is most often missing?',o:['Retirees','Transfers between group companies','Interns'],a:1,e:'Transfers are coded differently in HR.'}],

 qs:['Does the report include every change in the period? Compared with the system’s independent change record.','Does it include every field that matters, especially bank details? A report that misses bank changes misses the main risk.','Is the report logic unchanged since it was last validated? Changes to the report need re-validation.'],
 files:[['1. Supplier-change report','As used by Finance: the report to prove'],['2. Independent change record','All supplier changes from the system’s log, to compare'],['3. Report definition','Which fields and filters it uses, to check the logic'],['4. Report change history','Any edits to the report, to check it is unchanged']],
